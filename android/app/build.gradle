apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// 版本号唯一来源：仓库根 package.json
//   "version":            "1.4.0-beta.8"  → Android versionName
//   "androidVersionCode": 15              → Android versionCode
// 发版只改 package.json 一处；缺字段或格式非法直接报错中止（不猜、不静默回退）。
// ---------------------------------------------------------------------------
def pkgJsonFile = rootProject.file('../package.json')
if (!pkgJsonFile.exists()) {
    throw new GradleException("[version] 找不到 ${pkgJsonFile}：App 版本号的唯一来源，无法确定 versionName/versionCode")
}
def pkgJson
try {
    pkgJson = new groovy.json.JsonSlurper().parse(pkgJsonFile)
} catch (Exception e) {
    throw new GradleException("[version] 解析 ${pkgJsonFile} 失败：${e.message}")
}
def appVersionName = pkgJson.version?.toString()?.trim()
if (!(appVersionName ==~ /\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?/)) {
    throw new GradleException("[version] package.json 的 version 缺失或格式非法（期望 x.y.z 或 x.y.z-beta.N）：'${appVersionName}'")
}
def rawVersionCode = pkgJson.androidVersionCode
def appVersionCode = null
if (rawVersionCode instanceof Number) {
    appVersionCode = (rawVersionCode as Number).longValue()
} else if (rawVersionCode?.toString()?.trim() ==~ /\d+/) {
    appVersionCode = (rawVersionCode.toString().trim()) as Long
}
if (appVersionCode == null || appVersionCode <= 0) {
    throw new GradleException("[version] package.json 的 androidVersionCode 缺失或非法（必须是正整数，且每次发版递增）：'${rawVersionCode}'")
}

// ---------------------------------------------------------------------------
// 应用身份唯一来源：仓库根 config/appIdentity.json（Issue #271）
//   applicationId / namespace     → Android 包名（= 设备指纹输入的一部分，改它 = 换用户账号）
//   label.zh                      → app_name / title_activity_main（桌面名与任务切换器名同源）
//   expectedCertSha256            → 已发布证书指纹闸门（换它 = 签名迁移，另开单）
//   allowInsecureUpdateTransport  → 更新链路是否允许明文 http（#268 的决策落点，门禁见
//                                   scripts/check-identity.mjs）
// 和上面的版本号一样：这是唯一来源，缺字段或格式非法直接报错中止（不猜、不静默回退）。
// 为什么包名要当身份而不是标签：DeviceFingerprintPlugin 用 sha256Hex(androidId + 包名) 做设备
// 指纹，包名一换，全网老设备同时变成「新用户」，额度 / 邀请关系 / 卡密绑定全部对不上（#243/#252/#264）。
// ---------------------------------------------------------------------------
def identityJsonFile = rootProject.file('../config/appIdentity.json')
if (!identityJsonFile.exists()) {
    throw new GradleException("[identity] 找不到 ${identityJsonFile}：App 包名/应用名/证书指纹的唯一来源，无法确定应用身份")
}
def appIdentity
try {
    appIdentity = new groovy.json.JsonSlurper().parse(identityJsonFile)
} catch (Exception e) {
    throw new GradleException("[identity] 解析 ${identityJsonFile} 失败：${e.message}")
}
def identityApplicationId = appIdentity.applicationId?.toString()?.trim()
def identityNamespace = appIdentity.namespace?.toString()?.trim()
def identityLabel = appIdentity.label?.zh?.toString()
if (!(identityApplicationId ==~ /[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+/)) {
    throw new GradleException("[identity] config/appIdentity.json 的 applicationId 缺失或格式非法（期望 Android 包名，如 com.example.app）：'${identityApplicationId}'")
}
if (!(identityNamespace ==~ /[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+/)) {
    throw new GradleException("[identity] config/appIdentity.json 的 namespace 缺失或格式非法（期望 Android 包名）：'${identityNamespace}'")
}
if (!identityLabel?.trim()) {
    throw new GradleException("[identity] config/appIdentity.json 的 label.zh 缺失或为空：应用名的唯一来源（桌面图标名 / 任务切换器名）")
}

// ---------------------------------------------------------------------------
// 分发地址唯一来源：仓库根 config/endpoints.json 的 download.*（Issue #269）
//   download.primaryBase  → BuildConfig.DL_PRIMARY  → UpdateEndpoint.PRIMARY_BASE
//   download.fallbackBase → BuildConfig.DL_FALLBACK → UpdateEndpoint.FALLBACK_BASE
// 换分发机 = 改 config/endpoints.json 一处 + 重新打包；源码（Java / TS / gradle）里不留地址字面量。
// -PdlPrimaryBase / -PdlFallbackBase 只作例外通道（产物里的地址就不在仓库里了，发布后必须在
// CHANGELOG 记一笔）。
// 缺字段 / 不是「协议://主机[:端口]」/ 回退机不是 https / 两个 base 相同，一律中止：
// 带着错地址出包只会在用户点「检查更新」时表现为转圈，比构建失败难查得多。
// 注：下载白名单由这两个 base 在 UpdateEndpoint 里派生，这里不需要再配第二份主机名单。
// ---------------------------------------------------------------------------
def endpointsJsonFile = rootProject.file('../config/endpoints.json')
if (!endpointsJsonFile.exists()) {
    throw new GradleException("[dl] 找不到 ${endpointsJsonFile}：分发地址的唯一来源（download.primaryBase / download.fallbackBase）")
}
def endpointsJson
try {
    endpointsJson = new groovy.json.JsonSlurper().parse(endpointsJsonFile)
} catch (Exception e) {
    throw new GradleException("[dl] 解析 ${endpointsJsonFile} 失败：${e.message}")
}
// 只允许「协议://主机[:端口]」：这样拼进 Java 字符串字面量时不可能带引号 / 反斜杠，下面不用做转义
def DL_BASE_PATTERN = ~/https?:\/\/[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:\d{1,5})?/
def downloadConfig = endpointsJson.download
if (!(downloadConfig instanceof Map)) {
    throw new GradleException("[dl] config/endpoints.json 缺少 download 段（download.primaryBase / download.fallbackBase）")
}
def readDlBase = { String key, String propName ->
    def fromProp = providers.gradleProperty(propName).orNull?.trim()
    // 键必须是 String：用 GString 去 Map 取值查不到（GString 的 equals/hashCode 与 String 不同）
    def fromConfig = downloadConfig[key]?.toString()?.trim()
    def value = fromProp ?: fromConfig
    if (!value) {
        throw new GradleException("[dl] config/endpoints.json 缺少 download.${key}（也没传 -P${propName}）：无法确定分发地址")
    }
    if (!(value ==~ DL_BASE_PATTERN)) {
        throw new GradleException("[dl] download.${key} 必须是「协议://主机[:端口]」，不带路径 / 查询串 / 凭据：'${value}'")
    }
    return value.toString()
}
def dlPrimaryBase = readDlBase('primaryBase', 'dlPrimaryBase')
def dlFallbackBase = readDlBase('fallbackBase', 'dlFallbackBase')
if (dlPrimaryBase == dlFallbackBase) {
    throw new GradleException("[dl] 首选与回退分发地址相同（'${dlPrimaryBase}'）：回退要有意义，改 config/endpoints.json")
}
if (!dlFallbackBase.startsWith('https://')) {
    throw new GradleException("[dl] 回退分发机必须走 https（'${dlFallbackBase}'）：它承载所有历史版本的兜底升级")
}
if (providers.gradleProperty('dlPrimaryBase').present || providers.gradleProperty('dlFallbackBase').present) {
    logger.warn("[dl] 本次用 -P 覆盖了 config/endpoints.json：产物里的分发地址不在仓库里，发布后在 CHANGELOG 记一笔")
}

// ---------------------------------------------------------------------------
// 消费侧 / 支付侧地址（Issue #484 §6.2 / #487 W1-A）：同一份 config/endpoints.json 的另一端
//   consume.baseUrl → BuildConfig.CONSUME_BASE（Web 侧由 rspack 注入 __ENDPOINTS__.consume.baseUrl）
//   pay.baseUrl     → BuildConfig.PAY_BASE    （Web 侧由 rspack 注入 __ENDPOINTS__.pay.baseUrl）
// -PconsumeBase / -PpayBase 是**例外通道**（内测 / 灰度临时覆盖）：产物里的地址就不在仓库里了，
//   发布后必须在 CHANGELOG 记一笔。
// 判据与 scripts/lib/consumeEndpoints.mjs 一一对应（改那边要同步改这里）：
//   1) 必须 https —— **唯一例外**是本机回环（127.0.0.1 / localhost / [::1]），本地联调实例就是明文；
//   2) 不得命中废弃域黑名单（旧池域 IP / 旧池域端口 / legacyHosts）；
//   3) consume.baseUrl 与 pay.baseUrl 不得相同（两个后端职责不能混）；
//   4) 缺字段 / 未知键 / 空值 → 一律中止，并打印**键名 + 配置文件行号**。
// 带着错地址出包只会在真机上表现为「登录一直失败」或「额度转圈」，比构建失败难查得多。
// ---------------------------------------------------------------------------
def CONSUME_KEYS = ['baseUrl', 'apiV1Prefix', 'gatewayPrefix', 'timeoutMs']
def PAY_KEYS = ['baseUrl', 'timeoutMs']
def CONSUME_TIMEOUT_KEYS = ['read', 'write', 'redeem']
def PAY_TIMEOUT_KEYS = ['read', 'write']
def TIMEOUT_MIN_MS = 1000
def TIMEOUT_MAX_MS = 120000
// 废弃域标记：写出来才能拦住它们（与 scripts/lib/consumeEndpoints.mjs 的 DEPRECATED_MARKERS 同源）
// check-ip-allow：这份名单是「废弃域黑名单」本身 —— 下方拿它比对 consume.baseUrl / pay.baseUrl / legacyHosts，不是可调地址；删掉它等于删掉这道 build 期拦截（Issue #590）
def CONSUME_DEPRECATED_MARKERS = ['140.210.13.146', ':60013']
def CONSUME_BASE_PATTERN = ~/https?:\/\/[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:\d{1,5})?/

// 配置文件行号：先找段名（`"consume"` / `"pay"`）所在行，再在该行之后找字段名。
// 不用完整 JSON 解析器：端点表是手写的小 JSON，键名唯一，这个精度足够指到人要看的那一行。
def consumeEndpointsRawText = endpointsJsonFile.getText('UTF-8')
def consumeEndpointLines = consumeEndpointsRawText.readLines()
def quoted = { String name -> '"'.toString() + name + '"'.toString() }
// 注意箭头位置：Groovy 闭包的形参列表与 `->` 都必须在 `{` 与 `}` **之间**
// （`{ String name, int from -> ... }`）。写成 `{ ... } ->` 是语法错误，
// gradle 在**配置阶段**就 `Unexpected input: '->'` 直接 FAILURE，与 JS/Java 代码无关（#557）。
def findLine = { String name, int from ->
    int found = 0
    consumeEndpointLines.eachWithIndex { line, i ->
        if (found == 0 && i >= from && line.contains(quoted(name))) {
            found = i + 1
        }
    }
    return found
}
def lineOfKey = { String dotted ->
    def parts = dotted.tokenize('.')
    int from = 0
    int found = 0
    parts.each { part ->
        found = findLine(part, from)
        if (found > 0) {
            from = found
        }
    }
    return found > 0 ? ':' + found : ''
}

def failConsume = { String key, String why ->
    throw new GradleException("[consume] config/endpoints.json${lineOfKey(key)} ${key} ${why}")
}

def consumeConfig = endpointsJson.consume
if (!(consumeConfig instanceof Map)) {
    failConsume('consume', '缺失：消费侧（sub2api）地址与超时的唯一来源')
}
def payConfig = endpointsJson.pay
if (!(payConfig instanceof Map)) {
    failConsume('pay', '缺失：支付侧（apia）地址与超时的唯一来源')
}
consumeConfig.keySet().each { k ->
    if (!CONSUME_KEYS.contains(k.toString())) {
        failConsume('consume.' + k, "是未知键（只认 ${CONSUME_KEYS.join(' / ')}）")
    }
}
payConfig.keySet().each { k ->
    if (!PAY_KEYS.contains(k.toString())) {
        failConsume('pay.' + k, "是未知键（只认 ${PAY_KEYS.join(' / ')}）")
    }
}

// base：https 或本机回环；不带路径 / 查询串 / 凭据；不命中废弃域
def readConsumeBase = { String section, String propName, List<String> legacyHosts ->
    def fromProp = providers.gradleProperty(propName).orNull?.trim()
    def fromConfig = endpointsJson[section].baseUrl?.toString()?.trim()
    def value = fromProp ?: fromConfig
    if (!value) {
        failConsume("${section}.baseUrl", "缺失（也没传 -P${propName}）：无法确定 ${section} 地址")
    }
    if (!(value ==~ CONSUME_BASE_PATTERN)) {
        failConsume("${section}.baseUrl", "必须是「协议://主机[:端口]」，不带路径 / 查询串 / 凭据：'${value}'")
    }
    def isLoopback = value ==~ /http:\/\/(?:127\.0\.0\.1|localhost|\[::1\])(?::\d+)?/
    if (!value.startsWith('https://') && !isLoopback) {
        failConsume("${section}.baseUrl", "必须是 https（唯一例外是本机回环 127.0.0.1 / localhost）：'${value}'")
    }
    (CONSUME_DEPRECATED_MARKERS + legacyHosts).each { marker ->
        if (value.contains(marker.toString())) {
            failConsume("${section}.baseUrl", "命中废弃域黑名单 ${marker}（旧池域已下线）：'${value}'")
        }
    }
    return value.toString()
}

def consumeLegacyHosts = (endpointsJson.legacyHosts instanceof List) ? endpointsJson.legacyHosts.collect { it.toString().trim() } : []
def consumeBase = readConsumeBase('consume', 'consumeBase', consumeLegacyHosts)
def payBase = readConsumeBase('pay', 'payBase', consumeLegacyHosts)
if (consumeBase.replaceAll('/+$', '') == payBase.replaceAll('/+$', '')) {
    failConsume('pay.baseUrl', "与 consume.baseUrl 相同（'${payBase}'）：消费侧与支付侧是两个后端，职责不能混")
}
if (providers.gradleProperty('consumeBase').present || providers.gradleProperty('payBase').present) {
    logger.warn('[consume] 本次用 -P 覆盖了 config/endpoints.json：产物里的后端地址不在仓库里，发布后在 CHANGELOG 记一笔')
}

// 超时档位：正整数 + 单调递增（read ≤ write [≤ redeem]）。gradle 这一侧只校验、不进 BuildConfig ——
// 前端用 __ENDPOINTS__.consume.timeoutMs，原生侧不需要毫秒数（请求都由 CapacitorHttp 发）。
def checkConsumeTimeouts = { String section, List<String> keys ->
    def timeouts = endpointsJson[section].timeoutMs
    if (!(timeouts instanceof Map)) {
        failConsume("${section}.timeoutMs", "缺失或不是对象（需要 ${keys.join(' / ')} 毫秒数）")
    }
    timeouts.keySet().each { k ->
        if (!keys.contains(k.toString())) {
            failConsume("${section}.timeoutMs.${k}", "是未知键（只认 ${keys.join(' / ')}）")
        }
    }
    def values = [:]
    keys.each { k ->
        def raw = timeouts[k]
        def ms = (raw instanceof Number) ? (raw as Number).intValue() : -1
        if (ms < TIMEOUT_MIN_MS || ms > TIMEOUT_MAX_MS) {
            failConsume("${section}.timeoutMs.${k}", "必须是 ${TIMEOUT_MIN_MS}–${TIMEOUT_MAX_MS} 之间的整数毫秒：'${raw}'")
        }
        values[k] = ms
    }
    for (int i = 1; i < keys.size(); i++) {
        if (values[keys[i]] < values[keys[i - 1]]) {
            failConsume("${section}.timeoutMs.${keys[i]}", "档位必须递增（${keys[i - 1]} ≤ ${keys[i]}）：${values[keys[i - 1]]} > ${values[keys[i]]}")
        }
    }
}
checkConsumeTimeouts('consume', CONSUME_TIMEOUT_KEYS)
checkConsumeTimeouts('pay', PAY_TIMEOUT_KEYS)

// ---------------------------------------------------------------------------
// 签名配置：凭据从 android/keystore/keystore.properties 读取（该文件已 gitignore）
// 若文件缺失（例如全新 clone），构建脚本 build-apk.sh 会自动生成 keystore + properties。
//
// release 构建 fail-fast：缺 keystore.properties / 缺 release 字段 / keystore 文件不存在时
// 直接 throw 中止。历史上缺凭据会「不签名」或回退 debug keystore，导致用错证书发布、
// 已装用户无法覆盖升级。宁可构建失败，也不产出签名身份不确定的 release 包。
// ---------------------------------------------------------------------------
// 路径相对于 gradle 根工程（android/），即 android/keystore/keystore.properties。
// 历史：这里原来写成 rootProject.file("../keystore/...")，指向从未存在的仓库根 keystore/，
// 所以本工程从来没有真正应用过文件里的 signingConfig —— 已发布包全是 AGP 默认的
// /root/.android/debug.keystore 签的（e7c5baee…）。因此「把路径修对」本身就会换证书，
// 下面加了 EXPECTED_CERT_SHA256 指纹闸门：路径生效但证书不符时构建直接失败，不会悄悄换签。
def keystorePropertiesFile = rootProject.file("keystore/keystore.properties")
def keystoreProperties = new Properties()
def keystorePropertiesExists = keystorePropertiesFile.exists()
if (keystorePropertiesExists) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def RELEASE_KEY_FIELDS = ['storePasswordRelease', 'keyAliasRelease', 'keyPasswordRelease']
def missingReleaseKeys = RELEASE_KEY_FIELDS.findAll { !keystoreProperties[it]?.toString()?.trim() }

// ---------------------------------------------------------------------------
// 已发布 APK 的签名证书指纹（SHA-256）。所有历史版本（含 1.4.0-beta.8）都是这一个：
// /root/.android/debug.keystore 里的标准 debug key（AGP 在本工程没有显式 signingConfig 时
// 用的默认 key）。换证书 = 已装用户无法覆盖升级，所以下面的所有签名配置都必须先过这道指纹闸门。
//
// 禁止顺手切换证书：想换成正式 release key，必须单独规划迁移（新包名 / 应用商店渠道 /
// 引导用户重装），不能在这个仓库里悄悄改一行就算。
//
// 期望值来自 config/appIdentity.json 的 expectedCertSha256（Issue #271：已发布证书这一事实的
// 唯一记录点）。这里只做读取与格式校验，不改值。
// ---------------------------------------------------------------------------
def expectedCertSha256Raw = appIdentity.expectedCertSha256?.toString()?.trim()?.toLowerCase()
if (!(expectedCertSha256Raw ==~ /[0-9a-f]{64}/)) {
    throw new GradleException("[identity] config/appIdentity.json 的 expectedCertSha256 缺失或格式非法（期望 64 位小写十六进制）：'${appIdentity.expectedCertSha256}'")
}
def EXPECTED_CERT_SHA256 = expectedCertSha256Raw

/** 读 keystore 里某别名证书的 SHA-256；读不到返回 null（口令错误 / 文件缺失 / 别名不存在）。 */
def certSha256Of = { String storeFileRel, Object storePass, Object alias ->
    def f = file(storeFileRel)
    if (!f.exists()) return null
    def pass = (storePass ?: '').toString().toCharArray()
    for (String type : ['PKCS12', 'JKS']) {
        try {
            def ks = java.security.KeyStore.getInstance(type)
            f.withInputStream { ks.load(it, pass) }
            def a = alias?.toString()
            def cert = a ? ks.getCertificate(a) : ks.getCertificate(ks.aliases().nextElement())
            if (cert == null) return null
            return java.security.MessageDigest.getInstance('SHA-256').digest(cert.encoded).encodeHex().toString()
        } catch (Exception ignored) {
            // 换下一种类型再试；都不行则返回 null（构建侧按「指纹未知」处理）
        }
    }
    return null
}

def releaseStoreRel = keystoreProperties['storeFileRelease'] ?: '../keystore/release.keystore'
def debugStoreRel = keystoreProperties['storeFileDebug'] ?: '../keystore/debug.keystore'
def releaseCertSha = (keystorePropertiesExists && missingReleaseKeys.isEmpty())
        ? certSha256Of(releaseStoreRel, keystoreProperties['storePasswordRelease'], keystoreProperties['keyAliasRelease'])
        : null
def debugCertSha = (keystorePropertiesExists && keystoreProperties['storePasswordDebug'])
        ? certSha256Of(debugStoreRel, keystoreProperties['storePasswordDebug'], keystoreProperties['keyAliasDebug'])
        : null
// 只有「指纹与已发布证书一致」才允许真正启用该签名配置
def releaseSigningApproved = releaseCertSha == EXPECTED_CERT_SHA256
def debugSigningApproved = debugCertSha == EXPECTED_CERT_SHA256

// 这条 gradle 命令是否会产出 release 产物（assembleRelease / bundleRelease / installRelease / build / assemble …）。
// 认不出就按「会」处理：宁可误拦一次 debug 命令，也不产出签名身份不明的 release 包。
def releaseTaskRequested = gradle.startParameter.taskNames.any { t ->
    def leaf = t.toLowerCase().tokenize(':').last()
    leaf.contains('release') || (leaf in ['build', 'assemble', 'bundle', 'install', 'package'])
}
def keystoreFixHint = '''
       修复：release 包现在只能由「与已发布证书一致」的签名材料签出。
             已发布证书 = ${EXPECTED_CERT_SHA256}（/root/.android/debug.keystore，标准 debug key）。
             要换证书请另开签名迁移方案，禁止顺手切换（否则已装用户无法覆盖升级）。
       键名必须是 storeFileRelease / storePasswordRelease / keyAliasRelease / keyPasswordRelease，
       带 Release 后缀；写成 storeFile / storePassword / keyAlias / keyPassword 一律算缺字段。
       键名清单与每行含义以 android/keystore/keystore.properties.example 为准（该文件入库，照它填）。
       先跑 pnpm run check:keystore 做形状自检（缺哪个键 / 哪个路径不对 / 能不能读证书），再构建。
'''.stripIndent()
if (releaseTaskRequested) {
    if (!keystorePropertiesExists) {
        throw new GradleException("""
[签名] release 构建缺少 android/keystore/keystore.properties，已中止。
       不会退化成「不签名」或 debug 签名 —— 用错证书发布会让已装用户无法覆盖升级。
       缺失文件：${keystorePropertiesFile}
${keystoreFixHint}""".stripIndent())
    }
    if (missingReleaseKeys) {
        throw new GradleException("""
[签名] android/keystore/keystore.properties 缺少 release 字段：${missingReleaseKeys.join(', ')}，已中止。
       文件：${keystorePropertiesFile}
${keystoreFixHint}""".stripIndent())
    }
    def releaseStoreFile = file(releaseStoreRel)
    if (!releaseStoreFile.exists()) {
        throw new GradleException("""
[签名] keystore.properties 指向的 release keystore 不存在，已中止。
       storeFileRelease = ${releaseStoreFile}
${keystoreFixHint}""".stripIndent())
    }
    if (releaseCertSha == null) {
        throw new GradleException("""
[签名] 读不到 ${releaseStoreFile} 里 release 证书的指纹（口令 / 别名不对？），已中止。
${keystoreFixHint}""".stripIndent())
    }
    if (!releaseSigningApproved) {
        throw new GradleException("""
[签名] 签名证书与已发布版本不一致，已中止。
       已发布（全历史版本含 1.4.0-beta.8）: ${EXPECTED_CERT_SHA256}
       本次 release keystore      : ${releaseCertSha}
       换证书会让所有已装用户无法覆盖升级（必须卸载重装）。
       这是签名迁移，必须单独规划；禁止在本仓库顺手切换证书。
       当前可用做法：按 docs/RELEASE-MANUAL.md §1，把 keystore.properties 的
       storeFileRelease / storePasswordRelease / keyAliasRelease 指向已发布证书
       （/root/.android/debug.keystore），再跑 assembleRelease。
       不要退回 assembleDebug：它的产物编译进 android:debuggable="true"，禁止发布（Issue #60）。
${keystoreFixHint}""".stripIndent())
    }
}
if (keystorePropertiesExists && debugCertSha != null && !debugSigningApproved) {
    logger.warn("""[签名] android/keystore/debug.keystore 指纹 ${debugCertSha} ≠ 已发布证书 ${EXPECTED_CERT_SHA256}，
[签名] 已忽略该签名配置；本次沿用 AGP 默认的 /root/.android/debug.keystore（与已发布版本同证书）。""")
}

def updateVariant = providers.gradleProperty('artifactVariant').orElse(System.getenv('INTERNAL_BUILD') == '1' ? 'internal' : 'standard').get()
if (!(updateVariant in ['internal', 'standard'])) throw new GradleException('artifactVariant must be internal or standard')
if (System.getenv('INTERNAL_BUILD') != null && updateVariant != (System.getenv('INTERNAL_BUILD') == '1' ? 'internal' : 'standard')) {
    throw new GradleException('artifactVariant conflicts with INTERNAL_BUILD')
}

// ---------------------------------------------------------------------------
// 发布完整性防呆：debug 变体 + internal 变体标记 = 曾长期被当成发布包的那条路径。
// debug 变体编译进 android:debuggable="true"，包可被 adb / run-as 读取私有数据
// （1.0.0～1.4.0-beta.8 共 15 个已发布包都是这么出的，Issue #60）。
//
// 这里只打印告警，不改产物、不阻断构建：
//   - debug 变体仍是本地联调 / 模拟器烟测的合法产物，硬失败会打断现有开发流程；
//   - 上传前的硬门禁在 docs/RELEASE-MANUAL.md §4.5（aapt2 校验 debuggable 必须为 0）。
// 判据只看命令行里显式的 debug 任务，认不出时不打扰（例如 gradlew 默认任务 / IDE 同步）。
// ---------------------------------------------------------------------------
def debugVariantTaskRequested = gradle.startParameter.taskNames.any { t ->
    t.toLowerCase().tokenize(':').last().contains('debug')
}
if (debugVariantTaskRequested && updateVariant == 'internal') {
    logger.warn("""
[发布完整性] 本次构建：debug 变体 + artifactVariant=internal。
[发布完整性] 产物含 android:debuggable="true"（可被 adb / run-as 读取私有数据），不是发布包，禁止上传 dl。
[发布完整性] 发布请用：./gradlew assembleRelease -PartifactVariant=internal
[发布完整性] 上传前硬门禁：aapt2 dump badging <apk> | grep -c application-debuggable → 必须输出 0
[发布完整性] 背景：1.0.0～1.4.0-beta.8 的历史发布包正是这条路径产出的，见 Issue #60。
""".stripIndent())
}

android {
    // 包名 / 应用名都来自 config/appIdentity.json（见文件顶部）：这里不再写死任何字面量。
    namespace = identityNamespace
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        // AGP 8 起 BuildConfig 默认不生成（android.defaults.buildfeatures.buildconfig=false）：
        // 不显式打开，下面的 buildConfigField 会被静默忽略，UpdateEndpoint 编译期直接找不到符号。
        // 这是 #269 唯一新增的构建机制，别顺手删。
        buildConfig true
    }
    defaultConfig {
        applicationId identityApplicationId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        manifestPlaceholders = [artifactVariant: updateVariant]
        // 唯一来源：仓库根 package.json（见文件顶部）
        versionCode appVersionCode.toInteger()
        versionName appVersionName
        // 应用名 / 包名相关的 res 字符串同样从 config/appIdentity.json 生成（Issue #271）：
        // app_name / title_activity_main 以前在 res/values/strings.xml 里各写一份「鲸落」，
        // 换渠道名只改一处就会出现「桌面图标名」与「任务切换器名」不一致。
        // res/values/strings.xml 里已经删掉这四项 —— 两边并存会 duplicate resource。
        resValue "string", "app_name", identityLabel
        resValue "string", "title_activity_main", identityLabel
        resValue "string", "package_name", identityApplicationId
        resValue "string", "custom_url_scheme", identityApplicationId
        // 分发地址（config/endpoints.json → BuildConfig，见文件顶部）：UpdateEndpoint 只从这里读，
        // 源码不留字面量。换分发机 = 改那份 JSON 一处 + 重打包（Issue #269）。
        buildConfigField "String", "DL_PRIMARY", "\"${dlPrimaryBase}\""
        buildConfigField "String", "DL_FALLBACK", "\"${dlFallbackBase}\""
        // 消费侧 / 支付侧（config/endpoints.json → BuildConfig，见文件顶部 #484 / #487 W1-A）
        buildConfigField "String", "CONSUME_BASE", "\"${consumeBase}\""
        buildConfigField "String", "PAY_BASE", "\"${payBase}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // 注意：Gradle 里名叫 "debug" 的 signingConfig 就是 AGP 的默认 debug 签名配置，
        // 一旦在这里定义就会覆盖 ~/.android/debug.keystore。所以只有指纹与已发布证书一致时
        // 才定义它 —— 否则等于偷偷换掉所有 debug 包（= 现网 internal 包）的证书。
        if (keystorePropertiesExists && debugSigningApproved) {
            debug {
                storeFile file(debugStoreRel)
                storePassword keystoreProperties['storePasswordDebug']
                keyAlias keystoreProperties['keyAliasDebug']
                keyPassword keystoreProperties['keyPasswordDebug']
            }
        }
        // release 只在「证书指纹 == 已发布证书」时定义（否则 release 构建已在顶部 throw）
        if (releaseSigningApproved) {
            release {
                storeFile file(releaseStoreRel)
                storePassword keystoreProperties['storePasswordRelease']
                keyAlias keystoreProperties['keyAliasRelease']
                keyPassword keystoreProperties['keyPasswordRelease']
            }
        }
    }
    buildTypes {
        debug {
            // 默认不配置 → 用 AGP 默认的 ~/.android/debug.keystore（= 已发布证书，历史行为）。
            // 只有 android/keystore/debug.keystore 的证书指纹与已发布证书一致时才显式指定。
            if (keystorePropertiesExists && debugSigningApproved) {
                signingConfig signingConfigs.debug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // 凭据缺失 / 指纹不符时这里不配置签名，但该情况只会出现在非 release 命令里
            // （release 命令已在文件顶部 GradleException 中止），不会产出签名身份不明的 release 包。
            if (releaseSigningApproved) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
