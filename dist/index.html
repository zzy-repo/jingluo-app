<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>鲸落</title><style>
      /*
        兜底页样式（issue #104 / #180）。刻意只用 WebView 69 也能解析的老 CSS：
        没有自定义属性、没有 :has() / @container / :where()、没有 flex —— 因为「能进到这里」
        的用户内核本来就可能低于本项目声明的下限（Chrome 83）。样式放这里而不是内联 cssText，
        是因为卡片现在多了按钮、手动复制框与折叠区，逐个写内联串既难读也容易漏。
      */
      #compatibility-error {
        margin: 24px 16px;
        padding: 16px;
        border: 1px solid #f0b8b8;
        border-radius: 12px;
        background: #fff7f7;
        color: #7b2020;
        font: 15px/1.6 sans-serif;
        white-space: pre-line;
        word-break: break-word;
      }
      #compatibility-error[hidden] {
        display: none;
      }
      #compatibility-actions {
        margin: 0 16px;
      }
      #compatibility-actions[hidden] {
        display: none;
      }
      #compatibility-copy {
        display: block;
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 10px;
        background: #b93a3a;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        -webkit-appearance: none;
      }
      #compatibility-copy-hint {
        margin: 8px 0 0;
        color: #2f6b2f;
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-line;
      }
      #compatibility-copy-hint[hidden] {
        display: none;
      }
      #compatibility-copy-hint.compatibility-failed {
        color: #b93a3a;
      }
      #compatibility-copy-fallback {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 10px;
        padding: 10px;
        border: 1px solid #f0b8b8;
        border-radius: 8px;
        color: #7b2020;
        font: 12px/1.5 monospace;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #compatibility-copy-fallback[hidden] {
        display: none;
      }
      #compatibility-detail {
        margin: 0 16px 24px;
        color: #6b4a4a;
        font-size: 12px;
      }
      #compatibility-detail[hidden] {
        display: none;
      }
      #compatibility-detail-summary {
        padding: 8px 0;
        color: #b93a3a;
        cursor: pointer;
      }
      #compatibility-detail-body {
        margin: 0;
        padding: 10px;
        border: 1px solid #f3d6d6;
        border-radius: 8px;
        background: #ffffff;
        font: 11px/1.5 monospace;
        white-space: pre-wrap;
        word-break: break-all;
      }

      <div id="compatibility-actions" hidden>
        <button type="button" id="compatibility-copy"></button>
        <p id="compatibility-copy-hint" hidden></p>
        <textarea id="compatibility-copy-fallback" readonly rows="8" hidden></textarea>
      </div>
      <details id="compatibility-detail" hidden>
        <summary id="compatibility-detail-summary"></summary>
        <pre id="compatibility-detail-body"></pre>
      </details>
    </div>
