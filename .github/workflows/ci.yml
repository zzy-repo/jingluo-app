name: CI

# Issue #104：把「低内核白屏」的门禁真正放进流水线。
# 以前 check:legacy / check:matrix 只写在文档里靠人记得跑，结果同一根因反复投递到线上
# （#13 → #39 → #104：WebView 83/91/92 用户整包解析失败 = 静默白屏）。
# 这里把产物层下限检查变成 PR 与 main 的强制关卡，并带一条「负向对照」证明关卡不是空跑。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # 门禁优化第 7 条（check:exemptions）：判「豁免引用的承接单是否已关闭」要读 issue 状态。
  # 只读；判不出来（无凭据/无网）时本门禁按**环境失败**处理，不伪装成「条目有问题」。
  issues: read

# #405：容器化 job（golden / integration）里 `run` 的默认 shell 会退化成 `sh`（dash），
# 那些 `set -euo pipefail` 的步骤会直接 `Illegal option -o pipefail` 挂掉（实测 exit 2）。
# 显式钉成 bash：Runner 会以 `bash --noprofile --norc -eo pipefail` 执行，
# 非容器 job 本来就是这个 shell，行为不变。
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  # PR 上取消「同一个 PR 的旧 run」：省机器，PR 页面只留最新结论。
  # **main 上不取消**（以前是 `cancel-in-progress: true`，一视同仁）：
  #   被取消的 run 既不是绿也不是红 —— 它从 `statusCheckRollup` 里消失成「没有结论」，
  #   于是「main 的每个提交到底验过没有」变成一件没人知道的事（实测：连续 push 两次，
  #   前一个 run 变成 Cancelled，它的提交从此没有任何一次完整 CI 记录）。
  #   红必须可归因的前提是「有没有跑」先得是真的（准绳 #1 / #3）。
  # 代价：main 上连续 push 会排队/并行多跑几次 —— 这是「main 全绿」这个前提的必要开销。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: type / lint / unit / 产物兼容门禁
    runs-on: ubuntu-latest
    # 20 → 25 分钟不是「放水」：真正的超时判定落在**每一步**的 `timeout-minutes` 上
    # （贵步骤逐个钉住，见对应步骤；超时的红会点名是哪一步，而不是一句
    # 「The job ... has exceeded the maximum execution time」那种无法归因的红）。
    # job 级只做兜底，抬高是为了：末尾「失败归因」那一步（≤8 分钟）别被兜底提前砍掉，
    # 否则红了以后又回到「看不见其它红」的状态。
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # 必须在 setup-node 之前：setup-node 的 cache: pnpm 依赖 pnpm 已可执行
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile
      # ═══════════════ 区段 1：纯文本扫描（无构建依赖 · 无网络 · 只读）═══════════════
      # **准入条件（往这一区段里加门禁必须满足）**：不读 dist/、不改仓库（负向对照自建自删）、
      # **不依赖网络与凭据**（末尾「失败归因」步骤复跑时**不复传 env** —— 要 token 的检查放在这里，
      # 复跑只会产出「没凭据」的假红，那是假归因）、单条实测 <10s；「为什么它能进来」=「它便宜到可以再跑一遍」。
      #
      # 为什么它们必须在**最前面**（而不是像以前那样排在 Build 和 gradle 之后）：
      # 这一整个区段合计 ~20s，而它原来的位置在 Build(~30s)+JDK+两次 `./gradlew help`(~分钟级，
      # 冷缓存还要下 200MB) 之后。于是「src 里写死了一个 IP」这种 5 秒能判的错，要等到 4~6 分钟后
      # 才红 —— 而且 GitHub 在第一个失败步就停，作者根本看不到后面还有几条红。
      # 现在：便宜的排最前（准绳 #5「站在最便宜的失败点」），红的反馈时间从分钟级降到 10 秒级。
      # gate 与其负向对照**保持相邻**：一道门禁和「它能不能咬住」的证据必须一起读。
      #
      # >>> gate-triage:begin —— 末尾「失败归因」步骤从这两行标记之间抽取要复跑的门禁清单。
      #     不要把标记本身挪走/改名：抽不到清单时归因步骤会打 `::warning::` 并跳过（不会假红，
      #     但「红在哪几道」就又要靠人翻日志了）。
      # 两条纯文本扫描门禁：不依赖构建产物、合计 < 1s，放在最前面先把最便宜的红暴露出来。
      - name: 仓库卫生（check:hygiene）
        run: pnpm run check:hygiene

      # 行尾门禁（#533）：仓库里的文本文件一律 LF（`.gitattributes` 的 `* text=auto eol=lf`）。
      # #533 的起点：#323 的 30 个改动文件里 27 个只有行尾不同，「17 个真实冲突」被 CRLF 噪音放大成
      # 「19 个文件 21 个 hunk」，review 看不出真实改动、git blame 失效。只加 .gitattributes 不够：
      # `eol=lf` 只在 checkin 时归一，**不会**把已在索引里的 CRLF blob 在 checkout 时转成 LF，
      # 于是历史 CRLF 会一直躺着（本单第二个 commit 已按索引重写存量）。
      # 豁免按约定走 `.gitattributes`：`*.bat` / `*.cmd` 是 `-text`（cmd.exe 解析 label/goto 的坑，
      # 见 android/gradlew.bat），二进制是 `binary` 行 —— 门禁**从 .gitattributes 读**豁免口径，
      # 不在这里另抄一份。同样是纯文本扫描（`git ls-files --cached --others --exclude-standard`
      # + 逐文件找首个 CRLF，实测 ~0.4s）。扫未跟踪未忽略的文件是有意的：`printf 'x\r\n' > src/x.mjs`
      # 这种「刚造出来、还没 add」的探针，正是噪音进仓库前的最后一秒。
      - name: 行尾（check:eol）
        run: pnpm run check:eol

      # 负向对照（同 check:case-collision / check:db-version 的写法，**无** continue-on-error）：
      # 造一个 CRLF 的 .mjs → 门禁必须 exit 1 且点到「文件:首处 CRLF 行号」→ 删掉 → 必须 exit 0。
      # 探针**故意不 add**（模拟最常见的破法：编辑器把行尾存成 CRLF 就提交了）。
      # 清理放 trap：任何一拍失败都不把探针留在仓库里（假红比不测更糟）。
      - name: 负向对照：造一个 CRLF 的 .mjs 必须被 check:eol 拦下
        run: |
          set -euo pipefail
          probe=src/__gateEolProbe.mjs
          trap 'rm -f "$probe"' EXIT
          printf 'export const a = 1\r\nexport const b = 2\r\n' > "$probe"
          if out="$(node scripts/check-eol.mjs 2>&1)"; then
            echo "$out"
            echo "::error::负向对照失败：造了 CRLF 的 .mjs 后 check:eol 仍然通过，说明门禁没有真正生效"
            exit 1
          fi
          echo "$out"
          # 红必须点到「注入的那个文件 + 首处 CRLF 的行号」，否则可能红在别处（比如扫描范围被改宽）
          echo "$out" | grep -q "${probe}:1: " || { echo "::error::门禁红了但没点到 ${probe}:1（判据没咬住，报错点不对）"; exit 1; }
          rm -f "$probe"
          node scripts/check-eol.mjs
          echo "负向对照通过：CRLF 的 .mjs → exit 1 且点到 文件:行号，删掉 → exit 0"

      # iOS 工程版本号门禁（#873）：`cap add ios` 生成的是 Xcode 模板的
      # `MARKETING_VERSION = 1.0` / `CURRENT_PROJECT_VERSION = 1`，而仓库的版本号唯一来源是
      # package.json 的 `version` / `androidVersionCode`（Android 由 build.gradle 自己去读）。
      # iOS 没有这条链（xcodebuild 不读 JSON），于是实测漂成「package.json 2.0.1/41，iOS 1.0/1」——
      # 而 `pnpm type` / `lint` / 全部 L0–L1 / APK 出包**全绿**，因为没人读过那个 pbxproj。
      # 后果是用户能感知的：App Store 拒收重复 build 号、两端版本号对不上导致「用户报的版本」查不清。
      # 纯文本比对（读 package.json + pbxproj，< 100ms），跟着最便宜的那批放在前面。
      - name: iOS 工程版本号同源（check:ios-version）
        run: pnpm run check:ios-version

      # 负向对照（同 check:eol / check:case-collision 的写法，**无** continue-on-error）：
      # 把 pbxproj 的 MARKETING_VERSION 按 #873 事故原样改回 1.0 → 必须 exit 1，
      # 且报错要点到「那个文件 + 注入的值」→ 还原 → 必须 exit 0。
      # 还原放 trap：任何一拍失败都不把改坏的 pbxproj 留在工作树里（假红比不测更糟）。
      - name: 负向对照：把 pbxproj 的 MARKETING_VERSION 改回模板值必须被 check:ios-version 拦下
        run: |
          set -euo pipefail
          pbxproj=ios/App/App.xcodeproj/project.pbxproj
          cp "$pbxproj" "$pbxproj.gateprobe"
          trap 'mv -f "$pbxproj.gateprobe" "$pbxproj"' EXIT
          node scripts/check-ios-version.mjs
          node -e 'const fs=require("fs"),f=process.argv[1];fs.writeFileSync(f,fs.readFileSync(f,"utf8").replace(/^(\s*MARKETING_VERSION = )[^;]+(;)$/gm,(m,a,b)=>a+"1.0"+b))' "$pbxproj"
          if out="$(node scripts/check-ios-version.mjs 2>&1)"; then
            echo "$out"
            echo "::error::负向对照失败：把 MARKETING_VERSION 改回 1.0 后 check:ios-version 仍然通过，说明门禁没有真正生效"
            exit 1
          fi
          echo "$out"
          # 红必须点到「注入的那个文件 + 注入的那个值」，否则可能红在别处（比如判据被换成了别的东西）
          echo "$out" | grep -q "project.pbxproj:.*MARKETING_VERSION = 1.0" || { echo "::error::门禁红了但没点到注入处（判据没咬住，报错点不对）"; exit 1; }
          mv -f "$pbxproj.gateprobe" "$pbxproj"
          trap - EXIT
          node scripts/check-ios-version.mjs
          echo "负向对照通过：MARKETING_VERSION 改回 1.0 → exit 1 且点到注入处，还原 → exit 0"

      - name: 重复实现（check:dup-impl）
        run: pnpm run check:dup-impl

      # 大小写撞车门禁（#557）：仓库里不允许存在「仅大小写不同」的文件名。
      # 为什么必须机械化：main 上 `src/components/consume/` 并存 4 对只差大小写的模块
      # （`AccountPanel.tsx` / `accountPanel.ts` …，来自 #487 的面板拆分），Linux 上完全看不出问题，
      # 但 macOS（大小写不敏感的 APFS）上 tsc 报 TS1261、rspack 报 ESModulesLinkingError，
      # 于是本地 `pnpm type` / `pnpm build` 全红、APK 根本打不出来。人工 review 也拦不住：
      # diff 里那两行长得就像同一个文件的两个扩展名。判据（R1 路径 / R2 目录 / R3 模块 stem）见脚本头。
      # 纯文本扫描（`git ls-files`，无构建产物依赖，< 1s），跟着最便宜的那批放在前面。
      - name: 大小写撞车（check:case-collision）
        run: pnpm run check:case-collision

      # 负向对照（同 check:consume-api / check:doc-refs / check:i18n 的写法）：
      # 现场造一对只差大小写的模块 → 门禁必须 exit 1 → 删掉 → 必须 exit 0。
      # 只跑正例的步骤算「绿灯空跑」（#369）。这对探针文件故意不进索引：
      # 门禁扫的是「已跟踪 + 未跟踪未被忽略」，名字撞车在 `git add` 之前就已经能杀掉一个 checkout。
      - name: 负向对照：造一对仅大小写不同的文件必须被 check:case-collision 拦下
        run: |
          set -euo pipefail
          printf 'export const A = 1\n' > src/__GateCaseProbe.ts
          printf 'export const B = 2\n' > src/__gatecaseprobe.ts
          if node scripts/check-case-collision.mjs; then
            rm -f src/__GateCaseProbe.ts src/__gatecaseprobe.ts
            echo "::error::负向对照失败：造了一对仅大小写不同的文件后 check:case-collision 仍然通过，说明门禁没有真正生效"
            exit 1
          fi
          rm -f src/__GateCaseProbe.ts src/__gatecaseprobe.ts
          node scripts/check-case-collision.mjs
          echo "负向对照通过：仅大小写不同 → exit 1，删掉 → exit 0"

      # DB 版本硬编码门禁（#547 新建）：测试与源码里不许出现写死的 IndexedDB 版本号。
      # #547 的事故形状：库从 v12 升到 v13（#529），两个 L1 用例各自硬编码
      # `indexedDB.open('chat-demo', 12)` → `VersionError: The requested version (12) is less than
      # the existing version (13)`，CI 真红、重跑仍红，而报错看上去像「用例坏了」——
      # 真毛病是**版本号有两份**。三条主线（文件 / 图片 / 支付）都要碰这套存储，图片线可能还要升
      # v14，所以这条必须机械化：版本只许有 `src/services/chat/db.ts` 的 `DB_VERSION` 一个来源。
      # 纯文本扫描（不 import .ts、不依赖 dist，实测 < 1s），跟着最便宜的那批放在前面。
      - name: DB 版本硬编码（check:db-version）
        run: pnpm run check:db-version

      # 负向对照（同 check:consume-api / check:doc-refs / check:i18n 的写法，**无** continue-on-error）：
      # 往一份**真实用例**里追加一行写死的版本号（门禁扫的是 tests/**，注入必须落在它真会扫的位置）
      # → 必须 exit 1 且报出「文件:行 硬编码版本 99」→ 还原 → 必须 exit 0。
      # 还原放在 trap 里：任何一拍失败都不会把探针留在仓库里（假红比不测更糟）。
      - name: 负向对照：测试里写死 DB 版本号必须被 check:db-version 拦下
        run: |
          set -euo pipefail
          probe=tests/unit/check-ip-version.test.mjs
          backup="$(mktemp)"
          cp "$probe" "$backup"
          trap 'cp "$backup" "$probe"; rm -f "$backup"' EXIT
          printf '\nconst __negDbVersion = indexedDB.open(%s, 99)\n' "'chat-demo'" >> "$probe"
          if out="$(node scripts/check-db-version.mjs 2>&1)"; then
            echo "$out"
            echo "::error::负向对照失败：测试里写死 indexedDB.open('chat-demo', 99) 后 check:db-version 仍然通过，说明门禁没有真正生效"
            exit 1
          fi
          echo "$out"
          # 红必须点到「注入的那个文件」和「注入的那个版本号」，否则可能红在别处（比如扫描目录被改窄）
          echo "$out" | grep -q "硬编码版本 99" || { echo "::error::门禁红了但没报出注入的版本号 99（判据没咬住，报错点不对）"; exit 1; }
          echo "$out" | grep -q "$probe:" || { echo "::error::门禁红了但没指到注入的文件 $probe（判据没咬住，报错点不对）"; exit 1; }
          cp "$backup" "$probe"
          node scripts/check-db-version.mjs
          echo "负向对照通过：写死版本号 → exit 1 且指到 $probe，还原 → exit 0"

      # 文档引用门禁（#290 落地脚本，这次才接线）：验「文档里那些 `文件:行号` 还指得着吗」——
      # 文件存在、行号在文件内、起行不落在空行/孤立 `}` 上。同样是纯文本扫描（< 1s）。
      # 接线前它只在人记得的时候才跑，于是 main 上躺了 23 条 FAIL 没人发现；其中 15 条还是
      # 门禁自己造的假红（SKIP_DIRS 按目录名跳过 `coverage`，把 `docs/testing/coverage/*.md`
      # 连同索引一起跳过，害得引用它们的文档全被判「文件不存在」）。这次两件事一起收拾：
      # 脚本改成「索引照进、正文不扫」，剩下的 9 条逐条修（6 条行号漂移 → 改对；3 条死引用 → 删/改）。
      # 负向对照证明它真会咬：塞一个不存在的路径必须 exit 1，删掉必须 exit 0。
      - name: 文档引用门禁（check:doc-refs）
        run: pnpm run check:doc-refs

      - name: 负向对照：文档里写一个不存在的路径必须被 check:doc-refs 拦下
        run: |
          set -euo pipefail
          printf '负向对照：`src/services/does-not-exist-nc.ts:12`\n' > docs/zz-negative-control.md
          if node scripts/check-doc-refs.mjs; then
            rm -f docs/zz-negative-control.md
            echo "::error::负向对照失败：文档里写了不存在的路径后 check:doc-refs 仍然通过，说明门禁没有真正生效"
            exit 1
          fi
          rm -f docs/zz-negative-control.md
          node scripts/check-doc-refs.mjs
          echo "负向对照通过：写死路径 → exit 1，删掉 → exit 0"

      # #678：**省略前缀**的引用（`i18n/index.ts:5`、`components/…/MessageList.module.css:68`）
      # 以前在 extractRefs 里被 `continue` 静默丢掉 —— 不判存在性、不判行号。
      # 于是 `docs/capabilities/css.md` §2 整张表（全是 `components/…` 这种省略写法）连
      # 「文件还在不在」都没人验过，行号漂到 `}` 上也没人知道。现在改成按路径后缀找唯一匹配
      # 后照常判定；多匹配/零匹配报 WARN 点名（不静默）。
      # 这段对照专打「省略前缀 + 行号错」这个形状（**四拍**，还原放 trap）：
      #   ①干净 → exit 0   ②`i18n/index.ts:9999`（越界）→ 必 exit 1
      #   ③`i18n/index.ts:5`（空行）→ 必 exit 1   ④剩下的多匹配条目必须是 WARN 而非无声放行
      # 为什么不能只留上面那条 `src/services/does-not-exist-nc.ts`：它写全了路径，走的是老分支，
      # 恰恰证明不了「省略前缀」这一类进了判定（#678 之前它也是红的，而 css.md 那 12 处照样漏）。
      - name: 负向对照：省略前缀 + 行号错必须被 check:doc-refs 拦下（#678）
        run: |
          set -euo pipefail
          NC=docs/zz-negative-control-678.md
          OUT=$(mktemp)
          trap 'rm -f "$NC" "$OUT"' EXIT
          # 注意：不要写成 `node … | grep -q …`。开了 pipefail 之后，grep 先退出会让 node
          # 吃 SIGPIPE（141），管道整体判非零 —— 明明命中了也当没命中。先落盘再 grep。
          gate() { node scripts/check-doc-refs.mjs > "$OUT" 2>&1; }

          gate && echo "① 干净仓库：exit 0"

          printf '省略前缀 + 行号越界：`i18n/index.ts:9999`\n' > "$NC"
          if gate; then
            echo "::error::负向对照失败（②）：省略前缀的越界行号没有被判出来 —— 这类引用又回到「静默跳过」"
            exit 1
          fi
          grep -q '行号越界：9999' "$OUT" || {
            echo "::error::负向对照失败（②）：exit 1 了，但不是因为省略前缀那条引用（报错没点到 9999）"
            cat "$OUT"
            exit 1
          }
          echo "② 省略前缀 + 行号越界：exit 1，且点到了 i18n/index.ts:9999"

          printf '省略前缀 + 行号落在空行：`i18n/index.ts:5`\n' > "$NC"
          if gate; then
            echo "::error::负向对照失败（③）：省略前缀 + 空行行号没有被判出来"
            exit 1
          fi
          grep -q '起行 5 是空行' "$OUT" || {
            echo "::error::负向对照失败（③）：exit 1 了，但没点到「起行 5 是空行」"
            cat "$OUT"
            exit 1
          }
          echo "③ 省略前缀 + 空行行号：exit 1，且点到了「起行 5 是空行」"

          # 多匹配 / 零匹配不许静默：既不能判红（它没法定到唯一文件），也不许无输出地放过
          printf '省略前缀 + 后缀多匹配：`390/metrics.json`\n' > "$NC"
          gate || true
          grep -qE '后缀匹配到 [0-9]+ 个文件，无法定位' "$OUT" || {
            echo "::error::负向对照失败（④）：后缀多匹配的引用既没判红也没 WARN 点名 —— 静默跳过回潮了"
            exit 1
          }
          echo "④ 省略前缀 + 后缀多匹配：WARN 点名（不判红，但绝不静默）"

          rm -f "$NC"
          gate
          echo "⑤ 改对 / 删掉后：exit 0（负向对照四拍全过）"

      # check:redact：#387 的脱敏规则集门禁（P0 账号 / 资损字段）。
      # 这类漏洞的症状是「删掉一条规则没有任何别的用例变红」—— 门禁把 5 类必填规则
      # （device_id / 卡密 / 卡号 / order_token / 手机号）与「误伤负例」一起钉住，
      # 规则被删或被改宽都 exit 1。紧跟一条负向对照，证明门禁本身不是空跑。
      - name: 脱敏规则集（check:redact）
        run: pnpm run check:redact

      - name: 负向对照：把脱敏器换成恒等函数必须被 check:redact 拦下
        run: node scripts/check-redact.mjs --selftest

      # ─────────────── Issue #413：把已经存在但没人按的那几道门禁接进流水线 ───────────────
      # 和 check:manifest 同一条教训：脚本能判红 ≠ 有人在跑。#314 的 i18n 门禁建好后，
      # 因为没接线，main 上 17 个 compatBoot* 孤立 key 一路绿着漂到 #421 验收才被发现。
      #
      # check:i18n（#314）—— R1 key 集合双向相等 / R2 占位符对齐 / R3 t('key') 引用存在 /
      #   R4 无新增孤立 key / R5 无空值。纯文本扫描（不 import .ts、不依赖 dist，< 1s）。
      #   R4 基线 ORPHAN_BASELINE 只减不增：新增「定义未引用」的 key 当场红。
      #   紧跟一条负向对照（删掉一个 zh key 必须 exit 1、还原后 exit 0），证明门禁不是空跑。
      - name: i18n 门禁（check:i18n）
        run: pnpm run check:i18n

      - name: 负向对照：删掉一个 zh key 必须被 check:i18n 拦下（证明门禁不是空跑）
        run: |
          set -euo pipefail
          cp src/i18n/zh.ts /tmp/zh.ts.bak
          # 删掉一条真实存在的文案行（用 key 定位，不写死中文，避免 locale 影响）
          # ⚠️ 前置断言：先证明这行**真的在**、删完**真的少了**。这一段以前没有任何注入校验，
          # 键一改名/改缩进，`sed` 就成了空操作 → 门禁当然通过 → 报错却说「门禁没有真正生效」。
          # 同 check:endpoints 那条负向对照 2026-11 踩过的坑（读了不存在的字段，注入物是 "undefined"）。
          key=compatBootTitle
          before=$(grep -c "^  $key: " src/i18n/zh.ts || true)
          if [ "$before" != "1" ]; then
            echo "::error::负向对照注入无效：src/i18n/zh.ts 里 $key 这一行有 $before 处（应为 1），删不掉任何东西 → 对照不成立"
            exit 1
          fi
          sed -i "/^  $key: /d" src/i18n/zh.ts
          after=$(grep -c "^  $key: " src/i18n/zh.ts || true)
          if [ "$after" != "0" ]; then
            cp /tmp/zh.ts.bak src/i18n/zh.ts
            echo "::error::负向对照注入无效：删完之后 zh.ts 里还剩 $after 处 $key → 注入没生效，对照不成立"
            exit 1
          fi
          if node scripts/check-i18n.mjs; then
            cp /tmp/zh.ts.bak src/i18n/zh.ts
            echo "::error::负向对照失败：删掉 zh 的 compatBootTitle 后 check:i18n 仍然通过，说明门禁没有真正生效"
            exit 1
          fi
          cp /tmp/zh.ts.bak src/i18n/zh.ts
          node scripts/check-i18n.mjs
          echo "负向对照通过：删 key → exit 1，还原 → exit 0"

      # check:endpoints：端点配置单一真相（地址零副本 / 无废弃占位）。#413 时已存在且绿。
      - name: 端点配置检查（check:endpoints）
        run: pnpm run check:endpoints

      - name: 负向对照：往 src 塞一份端点地址字面量必须被 check:endpoints 拦下
        run: |
          set -euo pipefail
          # 地址从唯一事实来源读，不在 YAML 里再写一份（否则这段自己就成了一处副本）。
          # 字段用 `consumeBaseUrl`（config/endpoints.json 的 consume.baseUrl）：#869 起它就是**统一网关
          # BASE**（登录 + 推理 + 购买），也是 check:endpoints 的 needle 之一 —— 语义上最贴合「端点地址字面量」。
          # ⚠️ 这里原来读的是 `loadEndpoints().chatBaseUrl`，那个键在 #869 之后**根本不存在**，于是注入物
          # 一直是 `export const NEG_ENDPOINT = "undefined"`：里面没有任何地址 → check:endpoints 当然通过
          # → 对照每次都红，而报错却说「门禁没有真正生效」，把「注入物腐烂」伪装成「门禁坏了」。
          # 所以注入后立刻做**前置断言**（同一个 node 进程里，写完就校验）：注入物里必须真有一个 http(s) 地址，
          # 且它必须等于 `loadEndpoints()` 同一键的当前值。字段再改名/被删 → 这里自己红并说清原因。
          # 用 heredoc 而不是 `-e '...'`：判据那行正则里含单引号，塞进单引号字符串会把 bash 的引用弄断
          node --input-type=module <<'NODE'
            import { readFileSync, rmSync, writeFileSync } from "node:fs"
            import { loadEndpoints } from "./scripts/lib/endpoints.mjs"

            const FIELD = "consumeBaseUrl"
            const PROBE = "src/__gate_neg_endpoints.ts"
            const sourceOfTruth = () => loadEndpoints()[FIELD]

            const value = sourceOfTruth()
            writeFileSync(PROBE, `export const NEG_ENDPOINT = "${value}"\n`)

            // 前置断言①：注入物里必须真的含有一个地址（否则对照不成立，与门禁好坏无关）
            const written = readFileSync(PROBE, "utf8")
            const injected = written.match(/https?:\/\/[^"'\s]+/)?.[0]
            if (!injected) {
              console.error(
                `::error::负向对照无效：注入物里没有地址（${PROBE} 读到 ${JSON.stringify(value)}；` +
                  `loadEndpoints().${FIELD} 是空的/undefined，多半是字段改名或被删了）—— ` +
                  "对照不成立，这不是「门禁没生效」，先修这里读的字段名"
              )
              rmSync(PROBE, { force: true }) // 断言失败也要把注入物清掉，别把工作区留脏
              process.exit(1)
            }
            // 前置断言②：注入物里的地址必须与唯一事实来源同一键的当前值一致（同一来源两处一致，非硬编码比对）
            const again = sourceOfTruth()
            if (injected !== again) {
              console.error(
                `::error::负向对照注入不一致：注入物里的地址 ${injected} ≠ loadEndpoints().${FIELD} = ${JSON.stringify(again)}`
              )
              rmSync(PROBE, { force: true })
              process.exit(1)
            }
            console.log(`负向对照注入就绪：${PROBE} 含端点地址 ${injected}（来自 loadEndpoints().${FIELD}）`)
          NODE
          if out="$(node scripts/check-endpoints.mjs 2>&1)"; then
            echo "$out"
            rm -f src/__gate_neg_endpoints.ts
            echo "::error::负向对照失败：src 里写死端点地址后 check:endpoints 仍然通过，说明门禁没有真正生效"
            exit 1
          fi
          echo "$out"
          # 只证明 exit≠0 不够：判据被改窄、脚本恒红都会让 exit≠0 成立 —— 必须点到注入的那份文件
          echo "$out" | grep -q 'src/__gate_neg_endpoints.ts' || {
            rm -f src/__gate_neg_endpoints.ts
            echo "::error::门禁红了但没点名 src/__gate_neg_endpoints.ts（判据没咬住注入物）"; exit 1; }
          rm -f src/__gate_neg_endpoints.ts
          node scripts/check-endpoints.mjs
          echo "负向对照通过：写死地址 → exit 1，删掉 → exit 0"

      # ─────────── Issue #697（P0 发布链）：签名凭据门禁接进流水线 ───────────
      # 脚本是 #272 建的，但指纹判据一直是半死的：`expectedCertSha256()` 去 build.gradle 找
      # `EXPECTED_CERT_SHA256 = '<64 hex>'` 字面量，而 #271 之后这个值只在 config/appIdentity.json
      # 里（build.gradle 改成从配置派生）→ 期望值恒为 null、比较分支永不进入，那段 `⚠ 指纹不符`
      # 是死代码。于是「这把 key 是不是已发布证书」——换签名唯一能被自动发现的地方——等于不存在。
      # #697 修好判据（不符 → exit 1 且点名期望/实际，来源 config/appIdentity.json）并在这里接线。
      #
      # CI 上**没有** release keystore（secret 只在 `.github/workflows/build-apk.yml` 的「注入签名材料」
      # 那一步落盘；原来的 release.yml 已被 ce7968e3 删除，仓库里再没有自动发布路径 —— 注释别再指它），
      # 所以这一步跑显式降级档 `--config-only`：只校验「期望值的来源与一致性」
      # （config/appIdentity.json 里有合法指纹，且 build.gradle 若还留着副本必须相等），
      # **不校验真签名**，并把这句事实打进日志 —— 不是静默跳过（静默跳过 = 这道门禁回到空转）。
      # 真签名在签名构建机上跑全量：`build-apk.yml` 注入签名材料后 `pnpm run check:keystore`；
      # 本 job 后面（setup-java 之后）另有一条「临时 key 必须判红」的全量档负向对照。
      - name: 签名凭据配置门禁（check:keystore，CI 降级档：只校验配置与来源一致性）
        run: pnpm run check:keystore -- --config-only

      # 负向对照（同 check:doc-refs / check:db-version 的写法，**无** continue-on-error）。两拍：
      # ① 期望值格式坏掉（63 位 hex）→ 必须 exit 2 且点名 config/appIdentity.json
      #    （证明期望值真是从这份配置读的，不是别处抄来的常量；格式坏掉也不许「判不出来就放行」）
      # ② build.gradle 又冒出一份**不同值**的字面量 → 必须 exit 1 且点名两个值
      #    （第二份真相源的经典形态：一处改了另一处没改，最终「按这份配置过闸、按那份配置构建」）
      # `trap` 保证任何失败路径都还原；末尾 `git diff --exit-code` 把「还原失败」变成显式红。
      - name: 负向对照：期望指纹格式坏掉 / 冒出第二份来源都必须被 check:keystore 判红（还原 → 绿）
        run: |
          set -euo pipefail
          gate() { node scripts/check-keystore-config.mjs --config-only; }
          identity=config/appIdentity.json
          gradle=android/app/build.gradle
          id_backup="$RUNNER_TEMP/appIdentity.json.orig"
          gr_backup="$RUNNER_TEMP/build.gradle.orig"
          cp "$identity" "$id_backup"
          cp "$gradle" "$gr_backup"
          restore() { cp "$id_backup" "$identity"; cp "$gr_backup" "$gradle"; }
          trap restore EXIT

          # ① 正例：仓库现状必须 exit 0（否则后面两拍的红都是恒红）
          gate

          # ② 期望值格式坏掉（63 位）→ exit 1/2 都算红，但必须点名 config/appIdentity.json
          node -e '
            const fs = require("node:fs");
            const p = process.argv[1];
            const d = JSON.parse(fs.readFileSync(p, "utf8"));
            d.expectedCertSha256 = String(d.expectedCertSha256).slice(0, 63);
            fs.writeFileSync(p, JSON.stringify(d, null, 2) + "\n");
          ' "$identity"
          if out="$(gate 2>&1)"; then
            echo "$out"
            echo "::error::负向对照失败：expectedCertSha256 被截成 63 位后 check:keystore 仍然通过（判据没在读配置）"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q 'config/appIdentity.json' || { echo "::error::门禁红了但没点名 config/appIdentity.json（红在别处不算数）"; exit 1; }
          restore

          # ③ 第二份来源：往 build.gradle 追加一份**不同值**的字面量 → 必须 exit 1 且点名两个值
          node -e '
            const fs = require("node:fs");
            const p = process.argv[2];
            const expected = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).expectedCertSha256;
            const other = expected === "f".repeat(64) ? "e".repeat(64) : "f".repeat(64);
            fs.appendFileSync(p, `\ndef EXPECTED_CERT_SHA256 = \x27${other}\x27\n`);
          ' "$identity" "$gradle"
          if out="$(gate 2>&1)"; then
            echo "$out"
            echo "::error::负向对照失败：build.gradle 里冒出一份不同值的指纹后 check:keystore 仍然通过（第二份真相源没人管）"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q '两份来源' || { echo "::error::门禁红了但没点明「两份来源」"; exit 1; }
          echo "$out" | grep -q '来源 android/app/build.gradle' || { echo "::error::门禁红了但没点出 build.gradle 那份副本"; exit 1; }
          restore

          # ④ 还原 → 必须回到 exit 0，且工作树干净（还原失败在这里显式红，而不是留给下一个人）
          gate
          git diff --exit-code -- "$identity" "$gradle"
          echo "负向对照通过：格式坏掉 → 红且点名配置；冒出第二份来源 → 红且点名两份；还原 → exit 0"

      # 产物文件名前缀门禁（#836 scope ①）：安装包产物名从 `deepseek-chat-<ver>.apk` 改成
      # `jingluo-chat-<ver>.apk`，前缀的唯一来源是 config/appIdentity.json 的 artifactPrefix。
      # 这道门禁守的是「改名改了一半」—— 那种失败方式不红：CI 产新名、脚本还产老名、接口又一套，
      # 三者各自都能跑绿（客户端按清单的 file 字段下载，不按版本号拼名字），直到有人按名字对账。
      # 判据 P1–P5：配置合法且不退回历史前缀 / 生产者代码零字面量（剥注释后扫）/
      # 发布脚本与 CI CLI 同串 / file 字段两条实现同串 / 孤儿检测仍认得历史老包。
      # 纯本地（import 真模块调纯函数 + 扫文本），不连 ssh、不构建 APK，实测 < 2s。
      - name: 产物文件名前缀门禁（check:artifact-prefix）
        run: pnpm run check:artifact-prefix

      # 负向对照（同上面几条的写法，**无** continue-on-error）。三拍：
      # ① 内置负向对照（配置改回历史前缀 → P1 红；CI/脚本里塞回字面量 → P2 红；正本绿）；
      # ② **真**把 config 的 artifactPrefix 改回 `deepseek-chat` → 门禁必须 exit 1 且点到 P1
      #    （只证明 exit≠0 不够：判据被改窄、脚本恒红都会让 exit≠0 成立）→ 还原 → 必须 exit 0；
      # ③ 改回老前缀期间，私有发布脚本自己也算不出老名字（名字跟着配置走，不是抄在脚本里）。
      # `trap` 保证任何失败路径都还原。
      - name: 负向对照：artifactPrefix 改回 deepseek-chat 必须被 check:artifact-prefix 拦下（还原 → 绿）
        run: |
          set -euo pipefail
          ORIG="$RUNNER_TEMP/appIdentity-artifact-prefix.orig"
          cp config/appIdentity.json "$ORIG"
          restore() { cp "$ORIG" config/appIdentity.json; }
          trap restore EXIT

          # ① 内置负向对照（正本必须绿 + 三种改坏的样子必须红）
          node scripts/check-artifact-prefix.mjs --selftest

          # ② 真把唯一来源改回历史前缀 → 门禁必红且点到 P1
          sed -i 's/"artifactPrefix": "jingluo-chat"/"artifactPrefix": "deepseek-chat"/' config/appIdentity.json
          grep -q '"artifactPrefix": "deepseek-chat"' config/appIdentity.json || {
            echo "::error::负向对照注入失败：没能把 artifactPrefix 改回 deepseek-chat"; exit 1; }
          if out="$(node scripts/check-artifact-prefix.mjs 2>&1)"; then
            echo "::error::artifactPrefix 改回 deepseek-chat 后门禁仍然通过 —— 这条判据没有真正生效"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q 'P1' || { echo "::error::门禁红了但没报 P1（判据没咬住）"; exit 1; }
          echo "$out" | grep -q 'artifactPrefix' || { echo "::error::门禁红了但没点到 artifactPrefix"; exit 1; }

          # ③ 改回老前缀期间，发布脚本算出的名字必须跟着配置一起退回老前缀
          #    （= 名字真的从配置派生，而不是脚本里另抄了一份）
          legacy_name="$(node scripts/artifact-name.mjs --version 0.0.1 2>/dev/null || true)"
          if [ -n "$legacy_name" ]; then
            echo "::error::artifactPrefix 是历史前缀时就该拒绝出名字，实际打出了：$legacy_name"; exit 1
          fi

          # ④ 还原 → 必绿
          restore
          node scripts/check-artifact-prefix.mjs
          name="$(node scripts/artifact-name.mjs --version 0.0.1)"
          test "$name" = "jingluo-chat-0.0.1.apk" || {
            echo "::error::还原后的产物名不对：$name（应为 jingluo-chat-0.0.1.apk）"; exit 1; }
          echo "负向对照通过：artifactPrefix 改回 deepseek-chat → 门禁红(P1) 且出不了名字；还原 → 绿且产物名 jingluo-chat-0.0.1.apk"

      # #601 的**结构**根因（上面那条卫生门禁守的是「写完之后的现场」，这条守的是「默认值本身」）：
      # 事故那晚的命令是 `--version 1.4.2 --variant internal` —— 一个根参数都没带，而老版本
      # `DEFAULT_SITE_ROOT = '/var/www/dl'`，于是「按默认参数跑」= 把内部包写进公网 webroot。
      # 现在默认站点根 = 私有根 `/opt/dl-private`；写公网 webroot 必须显式 `--site-root`
      # **且** 加 `--allow-public-webroot`。门禁是静态 R1–R5 + 行为 B1–B5（import 脚本调纯函数），
      # 纯文本 + 纯函数：不连 ssh、不碰 /var/www、不发布任何包。
      - name: 私有发布默认根门禁（check:private-publish-root）
        run: pnpm run check:private-publish-root

      # 负向对照（同上面几条的写法，**无** continue-on-error）。四拍：
      # ① 默认参数（不带任何根参数）必须落在私有根 —— 这就是 #601 那晚的命令形态，现在必须 exit 0
      #    且打印「站点根 /opt/dl-private」；
      # ② 内置负向对照（5 种改坏方式全判红，正本判绿）；
      # ③ **真**把默认根改回 `/var/www/dl` → 门禁必须 exit 1 且点到 R2（只证明 exit≠0 不够：
      #    扫描范围被改窄、脚本恒红，都会让 exit≠0 成立）→ 还原 → 必须 exit 0；
      # ④ 同一个改坏的默认根下，**发布脚本自己**也必须拒绝（internal 包 × 公网根 = #601 形态）。
      # 全程只碰工作区里的那个脚本 + $RUNNER_TEMP，`trap` 保证任何失败路径都还原。
      - name: 负向对照：默认根改回 /var/www/dl → 门禁红 + 脚本拒（还原 → 绿）
        run: |
          set -euo pipefail
          ORIG="$RUNNER_TEMP/ppapk-default-root.orig"
          cp scripts/publish-private-apk.mjs "$ORIG"
          restore() { cp "$ORIG" scripts/publish-private-apk.mjs; }
          trap restore EXIT
          printf 'PK\x03\x04#601-default-root-probe' > "$RUNNER_TEMP/fake-601.apk"
          run_publish() {
            node scripts/publish-private-apk.mjs --transport local --dry-run --skip-apk-validation \
              --apk "$RUNNER_TEMP/fake-601.apk" --version 1.4.3 --versionCode 22 2>&1
          }

          # ① 默认参数 → 私有根（#601 的复现命令，现在必须安全）
          out="$(run_publish)"
          echo "$out" | grep -qE '站点根 +/opt/dl-private' || {
            echo "::error::默认参数没有落在私有根（#601 的默认值又回去了）"; echo "$out"; exit 1; }
          echo "$out" | grep -qE '根授权：私有根 /opt/dl-private' || {
            echo "::error::默认参数的根授权行不对"; echo "$out"; exit 1; }
          echo "$out" | grep -qE '私有清单 +/opt/dl-private/releases\.internal\.json' || {
            echo "::error::默认清单落点不是私有根下的 releases.internal.json"; echo "$out"; exit 1; }

          # ② 内置负向对照
          node scripts/check-private-publish-root.mjs --selftest

          # ③ 把默认根改回事故当晚的公网 webroot → 门禁必红且点到 R2
          sed -i "s|export const DEFAULT_PRIVATE_ROOT = '/opt/dl-private';|export const DEFAULT_PRIVATE_ROOT = '/var/www/dl';|" scripts/publish-private-apk.mjs
          grep -q "export const DEFAULT_PRIVATE_ROOT = '/var/www/dl';" scripts/publish-private-apk.mjs || {
            echo "::error::负向对照注入失败：没能把默认根改成 /var/www/dl"; exit 1; }
          if out2="$(node scripts/check-private-publish-root.mjs 2>&1)"; then
            echo "::error::默认根改回 /var/www/dl 后门禁仍然通过 —— 说明这条判据没有真正生效"; exit 1
          fi
          echo "$out2" | grep -q 'R2 默认站点根 / 私有根是 webroot 形态' || {
            echo "::error::门禁红了但没报 R2："; echo "$out2"; exit 1; }

          # ④ 同一个改坏的默认根下，脚本自己也要拒（internal × 公网根 = #601 形态）
          if out3="$(run_publish)"; then
            echo "::error::默认根是 /var/www/dl 时 internal 发布仍然通过（#601 又能复现了）"; exit 1
          fi
          echo "$out3" | grep -q '内部包不得写入公网分发根（#601）' || {
            echo "::error::脚本拒了但没点到 #601："; echo "$out3"; exit 1; }

          # ⑤ 还原 → 必绿
          restore
          node scripts/check-private-publish-root.mjs
          run_publish > /dev/null
          echo "负向对照通过：默认根 → 私有根（默认参数 exit 0）；改回 /var/www/dl → 门禁红(R2) + 脚本拒；还原 → 绿"

      # check:consume-api（#484 §6.5 / #487 W1-A 落地的脚本，本轮接线）：消费侧调用门禁 ——
      #   路径白名单（`/api/v1/**` 等字面量必须在 #484 §三 的表里）/ 地址零副本 / 废弃域 /
      #   明文 http / device_id 作凭据 / 凭据进 query / 原生 BuildConfig 注入。
      # 和 check:manifest 同一条教训（脚本能判红 ≠ 有人在跑）：脚本随 #494 落地时没进流水线，
      # 于是 R1~R8 这 8 条判据一直「绿着但没人跑」。纯文本扫描，不依赖 dist、实测 < 1s。
      # 紧跟一条负向对照（同 check:legacy / check:i18n / check:endpoints 的写法，**无** continue-on-error）：
      # 往 src/ 塞一条白名单外的路径 → R3 必 exit 1 → 删掉 → exit 0。
      - name: sub2api 调用白名单（check:consume-api）
        run: pnpm run check:consume-api

      - name: 负向对照：src 里塞一条白名单外的路径必须被 check:consume-api 拦下
        run: |
          set -euo pipefail
          # 白名单（#484 §三）之外的路径：写成字面量就会被 R3 认出来
          printf "export const NEG_CONSUME_PATH = '/api/v1/__gate_neg_not_whitelisted'\n" > src/__gate_neg_consume_probe.ts
          if node scripts/check-consume-api.mjs; then
            rm -f src/__gate_neg_consume_probe.ts
            echo "::error::负向对照失败：src 里塞了白名单外的路径后 check:consume-api 仍然通过，说明 R3 没有真正生效"
            exit 1
          fi
          rm -f src/__gate_neg_consume_probe.ts
          node scripts/check-consume-api.mjs
          echo "负向对照通过：白名单外路径 → exit 1，删掉 → exit 0"

      - name: 硬编码 IP 检查（check:ip）
        run: pnpm run check:ip

      # ─────────────── Issue #609（裁决 #614 决定 3，P0 发布安全）：webroot 卫生门禁 ───────────────
      # #601 事故的处置经验：光「把那条 internal 条目从 releases.json 里删掉」**不够** ——
      # 文件还躺在 /var/www/dl/apk/ 下，而静态目录不看清单，猜到 URL 就能下载。
      # 这条门禁扫的是**文件系统**（不是清单内容，那是 check:manifest 的活）：
      #   R1 备份/取证残留 —— *.bak* / *LEAKED* / _withdrawn* / releases.json.*（白名单外）/ *.tmp-*
      #   R2 webroot 内出现非 apk/ 的目录 —— private/ 尤其必须在 webroot 之外（/opt/dl-private/）
      #   R3 apk/ 下出现 internal|dev 字样的文件 —— 内部包绝不进公网静态目录
      #   R4 releases.json 里出现非 standard 条目（internal 条目数必须为 0，#620）—— 清单读不出来也红
      # runner 上没有 /var/www/dl（不是分发机），脚本会改为**内置演练**：在本地临时目录里逐个注入
      # 10 类脏东西 → 必红 → 还原 → 必绿。所以这一步永远不是「什么都没检查还全绿」。
      # 真 webroot 的扫描在分发机上做（部署验收第 6 步，见 docs/RELEASE-MANUAL.md §14.7）。
      - name: webroot 卫生门禁（check:webroot-hygiene）
        run: pnpm run check:webroot-hygiene

      # 负向对照（同 check:db-version / check:case-collision 的写法，**无** continue-on-error）：
      # 在 $RUNNER_TEMP 里造一个干净 webroot → 必 exit 0；R1/R2/R3 各注入一类脏东西 →
      # 必须 exit 1，且报错要**点到注入的那条规则与那个文件**（只证明 exit≠0 不够：
      # 扫描目录被改窄、脚本恒红，都会让 exit≠0 成立）→ 还原 → 必须 exit 0。
      # 全程只碰 $RUNNER_TEMP —— #609 的硬要求：不许拿生产机当试验田。
      - name: 负向对照：webroot 里的脏东西必须被 check:webroot-hygiene 拦下（R1/R2/R3/R4 各一类）
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dl-webroot-neg"
          rm -rf "$root"
          mkdir -p "$root/apk"
          printf '{"latest":"1.4.1","releases":[]}\n' > "$root/releases.json"
          printf 'apk\n' > "$root/apk/deepseek-chat-1.4.1.apk"
          # ① 正例：干净 webroot 必须 exit 0（否则门禁是恒红，没人敢开）
          DL_WEBROOT="$root" node scripts/check-webroot-hygiene.mjs

          # ② R1：事故取证残留（#601 现场那个文件名）
          printf '{}\n' > "$root/releases.json.LEAKED-1795185887"
          if out="$(DL_WEBROOT="$root" node scripts/check-webroot-hygiene.mjs 2>&1)"; then
            echo "$out"
            echo "::error::负向对照失败：webroot 里放 releases.json.LEAKED-1795185887 后门禁仍然通过"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q '\[R1' || { echo "::error::门禁红了但没报 R1（判据没咬住）"; exit 1; }
          echo "$out" | grep -q 'releases.json.LEAKED-1795185887' || { echo "::error::门禁红了但没点到注入的文件"; exit 1; }
          rm -f "$root/releases.json.LEAKED-1795185887"
          DL_WEBROOT="$root" node scripts/check-webroot-hygiene.mjs

          # ③ R2：private/ 出现在 webroot 内
          mkdir -p "$root/private"
          printf '{}\n' > "$root/private/releases.internal.json"
          if out="$(DL_WEBROOT="$root" node scripts/check-webroot-hygiene.mjs 2>&1)"; then
            echo "$out"
            echo "::error::负向对照失败：webroot 里建 private/ 后门禁仍然通过"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q '\[R2' || { echo "::error::门禁红了但没报 R2（判据没咬住）"; exit 1; }
          echo "$out" | grep -q 'private' || { echo "::error::门禁红了但没点到 private/"; exit 1; }
          rm -rf "$root/private"
          DL_WEBROOT="$root" node scripts/check-webroot-hygiene.mjs

          # ④ R3：apk/ 下出现 internal 包（#601 泄漏的那个包名）
          printf 'x\n' > "$root/apk/deepseek-chat-1.4.2-internal-HJ5NWRHQ.apk"
          if out="$(DL_WEBROOT="$root" node scripts/check-webroot-hygiene.mjs 2>&1)"; then
            echo "$out"
            echo "::error::负向对照失败：apk/ 下放 internal 包后门禁仍然通过"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q '\[R3' || { echo "::error::门禁红了但没报 R3（判据没咬住）"; exit 1; }
          echo "$out" | grep -q 'deepseek-chat-1.4.2-internal-HJ5NWRHQ.apk' || { echo "::error::门禁红了但没点到注入的包"; exit 1; }
          rm -f "$root/apk/deepseek-chat-1.4.2-internal-HJ5NWRHQ.apk"

          # ④b R4（#620）：公网清单里塞一条 internal 条目 → 必须 exit 1 且点到那条记录。
          #     这条断言要常驻：公网页面上「看起来没这条」不算数，清单里 internal 条目数必须为 0。
          cp "$root/releases.json" "$root/releases.clean.json"
          node -e '
            const fs = require("fs");
            const p = process.argv[1];
            const d = JSON.parse(fs.readFileSync(p, "utf8"));
            d.releases.push({
              version: "0.9.9", versionCode: 1, releasedAt: "2026-11-01T10:00:00+08:00",
              file: "apk/deepseek-chat-0.9.9.apk", size: 1, md5: "0".repeat(32), sha256: "a".repeat(64),
              changes: ["注入物"], buildType: "stable", breaking: false,
              artifactVariant: "internal", artifactVariantSource: "apk-manifest",
            });
            d.latest = d.latest || "0.9.9";
            fs.writeFileSync(p, JSON.stringify(d, null, 2) + "\n");
          ' "$root/releases.json"
          if out="$(DL_WEBROOT="$root" node scripts/check-webroot-hygiene.mjs 2>&1)"; then
            echo "$out"
            echo "::error::负向对照失败：公网清单里塞了一条 internal 条目后门禁仍然通过"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q '\[R4' || { echo "::error::门禁红了但没报 R4（判据没咬住）"; exit 1; }
          echo "$out" | grep -q '0\.9\.9' || { echo "::error::门禁红了但没点到注入的那条记录"; exit 1; }
          cp "$root/releases.clean.json" "$root/releases.json"
          rm -f "$root/releases.clean.json"
          if ! DL_WEBROOT="$root" node scripts/check-webroot-hygiene.mjs > /dev/null 2>&1; then
            echo "::error::负向对照失败：还原后门禁仍红（R4 成了恒红）"
            exit 1
          fi

          # ④c R4 fail-closed：清单读不出来时**不许**当作「没有 internal 条目」
          cp "$root/releases.json" "$root/releases.clean.json"
          printf '{"latest": "1.4.1", "releases": [' > "$root/releases.json"
          if out="$(DL_WEBROOT="$root" node scripts/check-webroot-hygiene.mjs 2>&1)"; then
            echo "$out"
            echo "::error::负向对照失败：清单解析不了时门禁仍然通过（fail-open）"
            exit 1
          fi
          echo "$out" | grep -q '\[R4' || { echo "::error::清单坏掉时门禁红了但没报 R4"; exit 1; }
          cp "$root/releases.clean.json" "$root/releases.json"
          rm -f "$root/releases.clean.json"

          # ⑤ 还原 → 必绿，并且临时目录里没留注入物
          DL_WEBROOT="$root" node scripts/check-webroot-hygiene.mjs
          test -z "$(ls -A "$root/apk" | grep -v '^deepseek-chat-1.4.1.apk$')" || { echo "::error::临时 webroot 里还有注入物"; exit 1; }
          rm -rf "$root"
          echo "负向对照通过：R1/R2/R3/R4 各自 → exit 1 且点到注入物，还原 → exit 0"

      # check:log-coverage：埋点覆盖面门禁（母单 #301 维度 9）。
      # 不加 --strict：#312 / #314 两条关键链路埋点缺口仍登记在 scripts/log-coverage-baseline.json，
      # strict 会把它们变 FAIL。子单做完、从 knownGaps 删掉后，这条自然会收紧。
      - name: 埋点覆盖面（check:log-coverage）
        run: pnpm run check:log-coverage

      # #484 §九 的 A1–A7 方向验收（脚本 #487 阶段②建的，一直"设计性红"，所以此前没接线）。
      # #590 把 A1/A4/A6 降到 0 命中之后才接：**先全绿再接线** —— 接一道恒红的门禁等于没有门禁。
      # 它回答的问题和别的门禁不同：别的是「这一处有没有违规」，它问「重构的方向还在不在」
      # （旧体系断没断 / 额度还是不是后端的 / base 还是不是配置化的 / 身份是不是 JWT）。
      # A2 内部会跑一遍 check:consume-api（不复制规则）；A7 恒为 MANUAL，不计 FAIL。
      # 纯文本扫描，不依赖 dist，实测 < 1s。
      - name: 方向验收 A1–A7（check:refactor-direction）
        run: pnpm run check:refactor-direction

      # 紧跟一条负向对照（同 check:legacy / check:i18n / check:endpoints / check:consume-api 的写法，
      # **无** continue-on-error）。这条对照同时钉住 #590 ① 的扫描口径，两件事都要成立：
      #   a) 只往 `android/app/src/main/assets/**`（`cap sync` 产物、.gitignore 忽略）里放一条旧池域地址
      #      → 必须**仍然 exit 0**。算进来就会「本地红、CI 绿」，同一份代码两种结论，收口永远说不清。
      #   b) 再往 `src/` 里放同一条地址 → 必须 exit 1（证明跳过生成目录不是把扫描器整体弄瞎）。
      #   c) 删掉 src/ 那份 → 必须回到 exit 0（红不是注入物没删干净造成的）。
      - name: 负向对照：生成目录不计入、src/ 里同样的地址必须被判红（#590 ①）
        run: |
          set -euo pipefail
          neg_dir='android/app/src/main/assets/public/static/js'
          neg_gen="$neg_dir/__gate_neg_refactor_direction.js"
          neg_src='src/__gate_neg_refactor_direction_probe.ts'
          log=/tmp/check-refactor-direction-neg.log
          mkdir -p "$neg_dir"
          printf "var neg = 'http://140.210.13.146:60013/apply';\n" > "$neg_gen"
          # a) 只有生成目录里的命中 → 必须仍然 exit 0
          if ! node scripts/check-refactor-direction.mjs > "$log" 2>&1; then
            rm -f "$neg_gen"
            cat "$log"
            echo "::error::对照失败：只有生成目录里的旧池域地址时 check:refactor-direction 仍判红 —— 扫描口径又漏了生成目录（本地红 / CI 绿）"
            exit 1
          fi
          # b) src/ 里同一地址 → 必须 exit 1（跳过生成目录不等于把扫描器弄瞎）
          printf "export const NEG_REFACTOR_ADDR = 'http://140.210.13.146:60013/apply'\n" > "$neg_src"
          if node scripts/check-refactor-direction.mjs > "$log" 2>&1; then
            rm -f "$neg_gen" "$neg_src"
            echo "::error::对照失败：src/ 里塞了旧池域地址后 check:refactor-direction 仍然通过，说明 A1 已经不咬了"
            exit 1
          fi
          # c) 还原 → 必须回到 exit 0（红不是注入物没删干净）
          rm -f "$neg_src" "$neg_gen"
          rmdir -p "$neg_dir" 2>/dev/null || true
          node scripts/check-refactor-direction.mjs > "$log" 2>&1 || { cat "$log"; echo "::error::对照失败：还原后 check:refactor-direction 仍然红"; exit 1; }
          echo "负向对照通过：生成目录不计入 → exit 0；src/ 里同一地址 → exit 1；删掉 → exit 0"

      - name: 测试重复检测（check:test-duplication）
        run: pnpm run check:test-duplication

      # 以下两条与 check:ip 同属静态扫描（不依赖 dist、合计 < 2s），放在产物检查之后收尾。
      # check:manifest：#330 的 releases.json 事故（11 条 buildType:"release" 发到线上）
      #   证明「校验器判 FAIL」和「真的有人跑」是两件事 —— 这里让校验器本身每次都被跑一遍。
      - name: 清单 fixture 校验（check:manifest）
        run: pnpm run check:manifest

      # 测试布局与重复检测（#362 阶段二 / #366 → #408 转 block）：同样是纯文本扫描
      # （各 < 2s、不依赖构建产物）。#408 起了 block，条件都已在仓库里落地：
      #   布局（--strict）：命名违规 0（域 3/4 六个批次文件已按 domainNN- 改名）+ fixture 散放 0
      #         （5 个散放桩已归位到 tests/fixtures/<域>/）+ 孤儿 0 + 基线条目 0
      #         （tests/test-layout-baseline.json 已清空，--strict 让「基线失真」也算红）。
      #   重复：逐字 ≥20 行 32 → 21 组，剩下的全部逐条登记在
      #         tests/test-duplication-baseline.json（**只减不增**，带 --update-baseline 也不许新增）；
      #         新复制一段 ≥20 行当场红。R2/R3（关键词 / 标题跨层）仍是 warning。
      # 两条都带负向对照（tests/unit/gate-negative-controls.test.mjs N4/N5）：注入必红、还原必绿。
      - name: 测试布局门禁（check:test-layout）
        run: pnpm run check:test-layout -- --strict

      # check:capabilities（#209）：能力假设盘点（JS API / CSS / 宿主能力 / 行为假设）。
      # **默认档 = 拦截档**（2026-11-25 关掉 warn 档）：缺陷没记账 → exit 1 并点名 `文件:行`；
      # 已记账且在账期内（`scripts/audit-debt/check-capabilities.json`）→ 只提示不拦；账**到期** → exit 1。
      # 现在有 10 处缺陷记在账上（带到期日与承接单），所以这一步今天会咬人 —— 新引入一处没登记的
      # 低内核用法，这里当场红。`--strict` 是**绝对档**（任何缺陷都 exit 1，不看账本），留给账清之后。
      - name: 能力假设盘点（check:capabilities，默认档=拦截档）
        timeout-minutes: 3
        run: pnpm run check:capabilities

      # #661：`docs/ui/**` 的截图曾只进不出 —— 553 张里 155 张（17.4 MiB）在仓库任何 tracked
      # 文本里零命中，既不是关单证据也不在任何 README 的结论表里。check:doc-refs 看不见这件事
      # （REF_EXT 里没有 png/jpg），所以单开一道：截图必须有出处，出处指到的截图必须还在。
      # 负向对照两条：删一张被引用的图（悬空）、塞一张没人引用的图（孤儿），都必须 exit 1。
      - name: 截图引用门禁（check:ui-shots）
        timeout-minutes: 4
        run: pnpm run check:ui-shots

      - name: 负向对照：孤儿截图 / 悬空引用都必须被 check:ui-shots 拦下
        run: |
          set -euo pipefail
          SHOT=docs/ui/thinking-collapse/before-390-default.png
          test -f "$SHOT" || { echo "::error::负向对照的基准文件不见了：$SHOT"; exit 1; }
          # ① 悬空：删掉一张被 README 引用的截图 → 引用指向不存在的文件 → 必须红
          mv "$SHOT" /tmp/zz-nc-shot.png
          if node scripts/check-ui-shots.mjs; then
            mv /tmp/zz-nc-shot.png "$SHOT"
            echo "::error::负向对照失败：删掉被引用的截图后 check:ui-shots 仍然通过，说明悬空引用没被判"
            exit 1
          fi
          mv /tmp/zz-nc-shot.png "$SHOT"
          # ② 孤儿：塞一张没有任何引用的截图 → 必须红
          #    两个坑：(a) 文件名要在运行时拼 —— 门禁把「任何 tracked 文本里出现的文件名」算引用，
          #    YAML 里写死名字等于自己把自己登记成出处（踩过）；(b) `git add -N`：门禁按 `git ls-files`
          #    判「提交里有什么」，untracked 的临时文件不算数。
          NC="docs/ui/zz-nc-orphan-$(date +%s%N).png"
          cp "$SHOT" "$NC"
          git add -N "$NC"
          if node scripts/check-ui-shots.mjs; then
            git reset -q -- "$NC"
            rm -f "$NC"
            echo "::error::负向对照失败：塞进无人引用的截图后 check:ui-shots 仍然通过，说明孤儿没被判"
            exit 1
          fi
          git reset -q -- "$NC"
          rm -f "$NC"
          node scripts/check-ui-shots.mjs
          echo "负向对照通过：删被引用的图 → exit 1，塞无人引用的图 → exit 1，还原后 → exit 0"
      # <<< gate-triage:end —— 区段 1 到此结束（上面这一行之后不许再放「triage 要复跑」的门禁）。
      # ═══════════════ 区段 2：网络类（发布溯源 + 豁免登记契约：要网络 / 要完整历史 / 要凭据）═══════════════
      # 单独成段的原因：它的输入是 `git fetch` + `gh release list`，失败可能是「你的 tag 打错了」，
      # 也可能是「网络/API 抖了」。把网络依赖的步骤集中成一段，红在哪一类上一眼可分（准绳 #3）。
      # **要网络 / 要凭据的步骤一律放这一区段，不许放区段 1**：区段 1 末尾的「失败归因」步骤会把
      # 区段 1 的单行 `run:` 抽出来复跑一遍，而复跑**不复传步骤级 `env`**（没有 `GH_TOKEN`）——
      # 于是一道需要凭据的门禁会在归因里产出「没凭据」的假红，把「红可归因」变成「红里混着假的」。

      # ─────────── 门禁优化第 7 条：**任何豁免都必须会过期**（check:exemptions） ───────────
      #
      # **为什么在区段 2 而不是区段 1**：这道门禁要用 `GH_TOKEN` 调 `gh issue view` 判「承接单是否已关闭」。
      # 区段 1 的末尾会把该区段的单行 `run:` 抽出来**复跑**一遍做失败归因，而复跑不复传步骤级 `env` ——
      # 放在区段 1 时它会在归因表里稳定产出一行「没凭据」的假红，把「红可归因」变成「红里混着假的」。
      # 区段 1 的准入条件是「不依赖网络」，破这个例就等于把「最便宜的失败点」那套基础设施拆掉，所以不破例。
      #
      # 六份「允许它先这样」的表（集成基线 known-red / flaky 隔离区 / 对抗基线 known-defect /
      # 重复基线 / 重复白名单 / 快速子集排除）此前都只有注释纪律：reason 可以空、followUp 没人核对、
      # 没有到期日。这一道把它们收成一份契约，并且**让它自己烂**：
      #   · 缺 reason/证据/承接单/到期日 → red；
      #   · 今天 > reviewAfter，或到期日远到等于没有 → red；
      #   · 已经跑绿 / 对象文件没了 / 承接单已关闭 / 声称还红但 60 天没人实跑 → red；
      #   · 把「缺产物、端口被占、机器慢」写成已知红 → red（环境问题是「没测」，不是「已知」）。
      # 只读，无浏览器、无构建（~1s + 每个承接待办一次 gh issue view）。
      # 抓不到 issue 状态时 `--strict` 判**环境失败 exit 2**（fail-closed）：不是条目有问题，
      # 是「这条判据今天没在工作」—— 两件事必须分开，否则谁也不知道该改条目还是该修凭据。
      - name: 豁免登记契约（check:exemptions）
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run check:exemptions -- --strict

      # 负向对照（脚本自带 `--selftest`，不碰仓库文件）：造 11 类坏条目 —— 缺 reason、占位句 reason、
      # 已过期、到期日远到等于没有、已跑绿（两种形态）、承接单已关闭、拿环境问题顶包、对象文件没了、
      # 声称还红但没人实跑、缺承接单 —— 每一个都必须被判非法；再放一条合法条目证明「必红」不是「恒红」。
      # 最后一条反例是「分片权重不是豁免」：机制不许把到期日无差别套在不是豁免的东西上。
      - name: 负向对照：缺 reason / 已过期 / 已跑绿 / 指向已关闭的 issue 的豁免条目必须被判非法
        run: node scripts/check-test-exemptions.mjs --selftest

      # ──────── v1.4.5 事故：已发布的 tag 必须在 main 历史里（check:release-traceability）────────
      # 事故（2026-11-21）：`v1.4.5` 的 tag 指向 `d5391944` —— 版本号 PR 分支上的提交，而 main 上同题提交是
      # squash 之后的 `b43d5559`：
      #
      #     $ git merge-base --is-ancestor v1.4.5 origin/main ; echo $?
      #     1
      #
      # 后果不是「包里差几行」，是**溯源链断了**：想「从 tag 复现问题」会 checkout 到一棵不在主线上的树，
      # 发布物与 main 上哪个提交对应只能靠人记。当时 30 多道门禁全绿 —— 它们检查的都是「产物」与「工作区」。
      #
      # 判据只有一条：**tag 指向的提交必须是 origin/main 的祖先**。
      # 不是 `git diff <tag> main`：那次差异里 `auth.ts` 那 7 行全是注释、另两个文件根本不进包，
      # 拿文本差异当判据会得出错误结论（详见 scripts/check-release-traceability.mjs 头部那段）。
      #
      # 前提（实测，不是猜）：`actions/checkout` 默认 `fetch-depth: 1` = **浅克隆且不带 tag**：
      #   · 浅克隆下 merge-base 只剩两头各 1 个提交，缺失的历史会被读成「不是祖先」→ 假红；
      #   · 不带 tag 时 `refs/tags/*` 根本不存在。
      # 所以下面先把 main 的完整历史与 tags 补齐（两次 fetch，实测 ≈1~2s）。脚本对「浅克隆 / 缺 origin/main /
      # 缺 tag」三种前提缺失一律 exit 2 并点明修法（fail-closed，不伪装成「tag 不在 main 上」那种红）。
      #
      # **无** continue-on-error：这道门禁存在的理由就是「发布物是否出自 main」必须每次被真判一遍。
      # 现状（2026-11-25 实测，别把这段当永久结论）：这道门禁**是绿的**。原文写着「main 上有两个 tag
      #   过不了（v1.4.5 / v1.4.1），tag 修好之前这一步是红的」—— 那句话已经过期，而一句过期的
      #   「这一步应该是红的」比不写更坏：它让人以为红是预期内的，于是真红也被当成背景。
      #   现在的口径：判据只看**最近 5 个正式版**（窗口，不是全部 tag），v1.4.1 登记在
      #   `scripts/release-traceability-allowlist.json`（带 reviewAfter 过期字段，脚本在 CI 环境
      #   自动等价 --strict），v1.4.5 已落到窗口之外。要复核就是把这一步的日志看一遍，
      #   不是回来读这段注释。
      # 前提单独一步（两件事分开：fetch 是「把判据的输入准备好」，门禁是「判定」）。
      # 拆成两步不只是好看：`tests/unit/gate-negative-controls.test.mjs` 的 N6 与
      # `tests/unit/contract-c8-gate-negative.test.mjs` 的 G1 都从 ci.yml 里抽
      # `run: pnpm run <gate>`（**单行**形态）来认定「这道门禁接线了」—— 写成多行块里的
      # `pnpm run ...` 会从两套登记机制里一起消失（登记表当场变 stale，接线也没人看得见）。
      - name: release 溯源：补齐 main 历史与 tags（check:release-traceability 的前提）
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin
          fi
          git fetch --force --tags origin
          echo "origin/main=$(git rev-parse --short origin/main)｜tags=$(git tag --list | wc -l)｜shallow=$(git rev-parse --is-shallow-repository)"

      - name: release 溯源（check:release-traceability）
        env:
          # gh 读 releases（哪些 tag 算「已发布」）；workflow 级 permissions: contents: read 足够
          GH_TOKEN: ${{ github.token }}
        run: pnpm run check:release-traceability

      # 负向对照（四拍，**无** continue-on-error）：同一个临时 tag，先指 origin/main（必须绿）→ 再指一个
      # **不在** main 历史里的提交（必须 exit 1 且点名 tag 与 sha）→ 还原（指回 main）→ 必须绿。
      # 为什么用 `git commit-tree` 造那个提交：它只写一个对象（父提交是 origin/main），不动工作区、不动分支、
      # 不推远端 —— 「不在 main 历史里」这个形状因此完全可控，且不依赖 PR 分支上有什么。
      # 这一步同时证明上面那两次 fetch 真把足够的历史拿到了：否则「必须红」会退化成「永远红」。
      - name: 负向对照：不在 main 历史里的 tag 必须被 check:release-traceability 拦下
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PROBE=zz-gate-neg-release-trace
          OUT=$(mktemp)
          trap 'rm -f "$OUT"; git tag -d "$PROBE" >/dev/null 2>&1 || true' EXIT
          MAIN=$(git rev-parse origin/main)

          # ① 正例：临时 tag 指向 origin/main 本身 → 必须 exit 0（同一个 tag 名，下面只换指向）
          git tag -f "$PROBE" "$MAIN"
          node scripts/check-release-traceability.mjs --tag "$PROBE" > "$OUT" 2>&1 || {
            echo "::error::负向对照的正例失败：tag 指向 origin/main 本身却判红了（前提 fetch 不够？）"
            cat "$OUT"
            exit 1
          }
          echo "① 指向 origin/main：exit 0"

          # ② 注入：同一个 tag 改指到一个**不在** main 历史里的提交（父提交是 origin/main）
          OFF=$(git -c user.name=ci -c user.email=ci@example.invalid commit-tree "$MAIN^{tree}" -p "$MAIN" -m "ci 负向对照：不在 origin/main 历史里的提交")
          git tag -f "$PROBE" "$OFF"

          # ③ 必须红，且报错点出「这个 tag + 这个 sha + 不在 origin/main 历史里」
          if node scripts/check-release-traceability.mjs --tag "$PROBE" > "$OUT" 2>&1; then
            echo "::error::负向对照失败：tag 指向非 main 提交后门禁仍然通过（判据没生效 / 被改软）"
            cat "$OUT"
            exit 1
          fi
          grep -F -q 'tag `'"$PROBE"'` 指向 `'"$(printf %s "$OFF" | cut -c1-8)"'`' "$OUT" || {
            echo "::error::负向对照失败：红了，但报错没点出「$PROBE → ${OFF}」"
            cat "$OUT"
            exit 1
          }
          grep -F -q '不在 origin/main 历史里' "$OUT" || {
            echo "::error::负向对照失败：红了，但没点明「不在 origin/main 历史里」"
            cat "$OUT"
            exit 1
          }
          echo "② 指向非 main 提交：exit 1，且点到了 $PROBE → ${OFF}"

          # ④ 还原 → 必须回到 exit 0（证明「红」是注入引起的，不是恒红）
          git tag -f "$PROBE" "$MAIN"
          node scripts/check-release-traceability.mjs --tag "$PROBE" > "$OUT" 2>&1 || {
            echo "::error::负向对照的还原拍失败：指回 origin/main 之后仍然红 —— 门禁可能恒红"
            cat "$OUT"
            exit 1
          }
          echo "③ 还原（指回 origin/main）：exit 0 —— 四拍全过"
      # ═══════════════ 区段 3：类型 / 行为（你的改动）═══════════════
      # 这一区段红 = **你的改动**破坏了编译、lint 或行为，与发布链、打包链无关。
      # Lint(0.7s) 在 Type(3.7s) 之前：同一个「代码坏了」的结论，先用便宜的那个判。


      - name: Lint
        timeout-minutes: 3
        run: pnpm run lint

      - name: Type check
        timeout-minutes: 5
        run: pnpm run type

      - name: Unit tests
        timeout-minutes: 12
        # 单元层对 locale 敏感（#179 已修，这里仍显式钉住 zh-CN 保持一致）
        env:
          LANG: zh_CN.UTF-8
          LC_ALL: zh_CN.UTF-8
        run: pnpm test

      # #368 把 tests/regression 接进了 LAYERS，但「接进 LAYERS」不等于「有人跑」—— 整层 11 个
      # 纯 Node 回归文件（无浏览器、无网络）4s 跑完，此前零触发点（issue-135 import 已删的
      # startCheckout 就是这么烂掉的）。
      # #405 把它从「L1 分片 1」挪到这里：checks 只有 ~2 分钟、离 4 分钟预算很远，
      # 而 L1 分片 1 是要压进 4 分钟的 job —— 纯 Node 的 4s 不该占 L1 的预算。
      - name: 回归层（tests/regression，纯 Node，~4s）
        timeout-minutes: 5
        run: node tests/run-layer.mjs regression

      # ─────────────── Issue #415：把 deploy/dl-release/test 的用例接进流水线（#441 起 37 条）───────────────
      # 同一类教训的第四处（前有 #368 的 regression 层、#365 的 integration 层、#413 的门禁）：
      # `deploy/dl-release/test` 的用例（variant 9 / apk-manifest 9 / server-buildtype 6 /
      # version-endpoint 3（#441）/
      # domain10-server-contract 10）一直**全绿但零触发点** —— 不在 `run-layer` 的 LAYERS、CI 无步骤，
      # 删掉它们不会有任何红。
      # 接线方式（#415 的取舍见 docs/TESTING-POLICY.md 第 12 节）：
      #   · 用例留在原地（与被测实现 deploy/dl-release/*.mjs 同目录，相对引用搬不动）；
      #   · `tests/run-layer.mjs` 的 LAYERS 新增 `server` 层（LAYER_DIRS 指向该目录），
      #     `node tests/run-layer.mjs server` 可跑；
      #   · `scripts/check-test-layout.mjs` 有一条带理由的白名单条目，把「枚举不到」判红；
      #   · 这一步按 `pnpm run test:dl-release`（= `node --test deploy/dl-release/test/*.test.mjs`）跑，
      #     纯 Node、无浏览器、不依赖 dist，实测 ~3-7s。不加 continue-on-error：真红必须红。
      - name: dl-release 用例（deploy/dl-release/test，83 条，纯 Node）
        timeout-minutes: 8
        run: pnpm run test:dl-release
      # ═══════════════ 区段 4：构建 + 产物门禁 ═══════════════
      # 这一区段红 = **能编译但产物不合格**（polyfill / 内核下限 / 接缝泄漏 / 目标变体）。
      # 顺序由依赖决定，不是偏好：全部步骤都读 dist/，所以必须整段排在 Build 之后。
      # 段内按实测耗时升序（test-seam 0.6s → syntax-floor 7.5s → bundle-target 10.7s →
      # legacy 12.1s → matrix 22.2s），最贵的 `check:matrix` 收尾。


      - name: Build (internal)
        timeout-minutes: 8
        run: pnpm run build:internal

      # 登录接缝守卫（#510）：`AuthGate` 的 `__TEST_AUTH_STATE__` 必须是**构建期常量**，
      # 正常构建由 DefinePlugin 内联成 undefined → 守卫被死代码消除。这个 job 构建的是**不带**
      # `TEST_AUTH_SEAM=1` 的生产/内测产物，所以 dist/ 里一旦扫到那个标识符或假 token
      # `test-token-not-real`，就说明接缝漏进了产物（线上多一条不用登录的路）→ exit 1。
      # 紧跟一条负向对照（同 check:consume-api 的写法）：往产物里塞一个假 token，门禁必须判红。
      - name: 登录接缝不进产物（check:test-seam）
        timeout-minutes: 3
        run: pnpm run check:test-seam

      # 负向对照（同 check:consume-api / check:doc-refs 的四拍写法）：往产物里塞一个假 token，
      # 门禁必须判红、且必须让流水线红 —— 只跑正例的步骤算「绿灯空跑」（#369）。
      # 直接调脚本而不是 `pnpm run check:test-seam`：contract-c8 的「门禁 → script → 真判定步骤」
      # 是现场派生的，它认 `if node scripts/<script>.mjs …; then … exit 1` 这个形状。
      - name: 负向对照：产物里塞假 token 后 check:test-seam 必须判红
        run: |
          set -euo pipefail
          # 假 token 不在 YAML 里抄一份：从唯一来源（scripts/lib/testAuthSeam.mjs）读
          marker="$(node --input-type=module -e 'import { SEAM_ACCESS_TOKEN } from "./scripts/lib/testAuthSeam.mjs"; process.stdout.write(SEAM_ACCESS_TOKEN)')"
          test -n "$marker"
          printf 'var leak="%s";\n' "$marker" > dist/__seam_neg_probe.js
          if node scripts/check-test-seam.mjs; then
            rm -f dist/__seam_neg_probe.js
            echo "::error::负向对照失败：产物里塞了假 token 后 check:test-seam 仍然通过，说明扫描没有真正生效"
            exit 1
          fi
          rm -f dist/__seam_neg_probe.js
          node scripts/check-test-seam.mjs
          echo "负向对照通过：产物里塞假 token → exit 1，删掉 → exit 0"

      # issue #104：把「声明的最低内核」与「入口产物真实的最低内核」放在一起比。
      # 为什么单开一条：check:legacy 的判据是「Chromium 83 能力集」，而 `?.` / `??` 是 Chrome 80，
      # 本来就在 83 的能力集里 —— 所以产物真实下限被抬到 80（甚至更高）时它**永远是绿的**。
      # 「OPPO 上白屏 + 抱怨 Unexpected token '?'，而门禁全绿」就是这么来的。
      - name: 语法下限对账（check:syntax-floor）
        timeout-minutes: 3
        run: pnpm run check:syntax-floor

      # 依赖 dist：没有产物时脚本直接 exit 1（不是跳过），因此必须排在 Build (internal) 之后。
      - name: 产物目标门禁（check:bundle-target）
        timeout-minutes: 4
        run: pnpm run check:bundle-target

      - name: 产物语法/API 下限（check:legacy）
        timeout-minutes: 4
        run: pnpm run check:legacy

      - name: 负向对照：含 ?. 的产物必须被拦下（证明门禁不是空跑）
        run: |
          set -euo pipefail
          rm -rf /tmp/dist-neg
          cp -r dist /tmp/dist-neg
          target=$(ls /tmp/dist-neg/static/js/main*.js | head -1)
          printf '\nconst __ciNeg = (globalThis)?.__ciNeg ??= 1;\n' >> "$target"
          if node scripts/check-bundle-syntax.mjs /tmp/dist-neg; then
            echo "::error::负向对照失败：注入了 ?. / ??= 的产物仍被判定合格，说明门禁没有真正生效"
            exit 1
          fi
          echo "负向对照通过：含 ?. / ??= 的产物被拦下"

      - name: 静态兼容矩阵（check:matrix）
        timeout-minutes: 4
        run: pnpm run check:matrix
      # ═══════════════ 区段 5：gradle / 打包配置（JS 全绿 ≠ 打得出包）═══════════════
      # 这一区段红 = 前端全绿但 native 侧配置坏了（#557 的教训：`build.gradle` 把闭包箭头写在
      # 花括号外，22 道门禁全绿而 `./gradlew` 直接 FAILURE）。它必须最后跑：JAVA/AGP/200MB 的
      # gradle 发行版是整条流水线里最贵的前置条件，前面任何一道便宜门禁红了都不该为它付钱。


      # ─────────────── Issue #563：gradle 配置可解析（拦住「JS 全绿但打不出包」）───────────────
      # #557 的教训：main 上 22 道门禁全绿，`./gradlew` 却直接 FAILURE（`build.gradle:148` 把闭包箭头
      # 写在了花括号外）。tsc / lint / 单测 / 产物扫描**都看不见 gradle 脚本**——「JS 侧全绿」本来
      # 就不等于「出得了包」。这一步只做一件事：让 gradle 把脚本求值一遍。
      #
      # 为什么不跑 assembleRelease：太贵（真要下 AGP 依赖 + 打 dex，分钟级），而 `help` 在
      # configuration 阶段就会执行 build.gradle / app/build.gradle / capacitor.build.gradle /
      # settings.gradle —— 语法错、apply 到不存在的文件、未知属性，全在这一步红。
      #
      # 为什么前面要先 `cap sync`：`android/capacitor-cordova-android-plugins/` 与
      # `android/app/src/main/assets/*` 是 **cap 生成物、不入库**（android/.gitignore），
      # 干净 checkout 上直接 `./gradlew help` 会红在
      # `Could not read script …/cordova.variables.gradle`——那是「生成物缺失」，不是「脚本坏了」，
      # 一条恒红的门禁等于没有门禁（实测确认过：不加这一步，本步骤在干净副本上必然 FAILED）。
      # 用 `cap sync`（与 build-apk.sh 同一条命令）而不是手搓桩文件：桩文件和真生成物一旦漂移，
      # 这一步验的就不是「我们的 gradle 能不能被求值」了。实测 `cap sync` 约 1.7s。
      # 顺序要求：必须排在 Build (internal) 之后 —— `cap sync` 要把 dist/ 拷进 assets。
      - name: Setup JDK 21（gradle 配置校验用，与 build-apk.sh 的 REQUIRED_JAVA_MAJOR 对齐）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 负向对照（真 keystore，**无** continue-on-error）：上面那条降级档只验「配置一致性」，
      # 这一步验**真签名判据本身** —— 全量档要求「keytool 读出来的证书指纹 == 已发布证书」。
      # 做法：现造一把只在本 job 存在的 keystore（$RUNNER_TEMP）→ 它的证书必然不是已发布证书
      # → `pnpm run check:keystore` 必须 exit 1，且必须同时点名期望值与实际值（来源 config/appIdentity.json）。
      # 只证明 exit≠0 不够：脚本恒红、或比较分支根本没进（#697 之前的死代码形态）都会 exit≠0 或 exit 0，
      # 所以两个值都要命中。「相符 → exit 0」那一拍 CI 上做不到（那等于手里有已发布私钥）——
      # 由单元层 N8 在临时树里跑（tests/unit/gate-negative-controls.test.mjs），本步骤末尾会打印这句话。
      # 顺序要求：必须排在 Setup JDK 之后（keytool）。
      - name: 负向对照（真 keystore）：临时 key 的指纹 ≠ 已发布证书 → check:keystore 必须 exit 1 并点名两个值
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/gate-neg-not-published.p12"
          props="$RUNNER_TEMP/gate-neg-keystore.properties"
          rm -f "$ks" "$props"
          keytool -genkeypair -keystore "$ks" -storetype PKCS12 -alias gate-neg-not-published \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=gate neg, O=dsh" \
            -storepass gateNegPass -keypass gateNegPass > /dev/null 2>&1
          # 口令只走属性文件（不入日志）：这是本 job 现造的一次性 key，不是发布凭据
          {
            printf 'storeFileRelease=%s\n' "$ks"
            printf 'storePasswordRelease=%s\n' 'gateNegPass'
            printf 'keyAliasRelease=%s\n' 'gate-neg-not-published'
            printf 'keyPasswordRelease=%s\n' 'gateNegPass'
          } > "$props"
          chmod 600 "$props"
          if out="$(node scripts/check-keystore-config.mjs --file "$props" 2>&1)"; then
            echo "$out"
            echo "::error::负向对照失败：换了一把 key 后 check:keystore 仍然通过 —— 指纹判据在空转（#697 之前它就是这样）"
            exit 1
          fi
          echo "$out"
          expected="$(node -e 'process.stdout.write(require("./config/appIdentity.json").expectedCertSha256)')"
          test -n "$expected"
          # 红必须同时点出「期望值」「实际值」「来源」三件事，否则可能红在别的分支上
          echo "$out" | grep -q "期望 ${expected} 实际 [0-9a-f]\{64\}" || {
            echo "::error::门禁红了但没同时点名期望值（${expected}）与实际值"; exit 1; }
          echo "$out" | grep -q '来源 config/appIdentity.json' || {
            echo "::error::门禁红了但没点出期望值的来源（config/appIdentity.json）"; exit 1; }
          echo "$out" | grep -q '证书指纹不符' || { echo "::error::门禁红了但不是因为指纹不符"; exit 1; }
          echo "负向对照通过：非已发布 key → exit 1 且点名「期望 X 实际 Y（来源 config/appIdentity.json）」；"
          echo "「相符 → exit 0」那一拍由单元层 N8 在临时树里跑（tests/unit/gate-negative-controls.test.mjs）"

      - name: Gradle 缓存（wrapper 发行版 + 依赖；命中后这一步只剩配置时间）
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # key 里带上 wrapper / gradle 脚本的 hash：升 gradle 或改 build.gradle 时自然换一份缓存
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle', 'android/variables.gradle', 'android/settings.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 生成 capacitor 原生配置（cap 生成物不入库，gradle 求值需要它们）
        timeout-minutes: 3
        run: pnpm exec cap sync android

      - name: gradle 配置可解析（拦住 build.gradle 语法错）
        # 5 分钟硬上限：冷缓存首次要下 gradle-8.14.3-all（~200MB）。超时就是红，不会静默拖慢 PR。
        #
        # -PallowLoopbackConsume=true（Issue #601）：仓库里当前提交的 config/endpoints.json 的
        # consume.baseUrl 还是本地联调回环地址（生产 host 待 #482 提供），而闸 1 要求
        # 「回环地址的包必须显式声明」才能出包。这一步只求值 gradle 脚本、不产出任何可分发产物，
        # 所以显式声明「这是本地联调构建」是准确的；闸 1 本身的正/负向对照见下一步。
        timeout-minutes: 5
        run: cd android && ./gradlew help --no-daemon --console=plain -PallowLoopbackConsume=true

      - name: 闸 1 负向对照：回环 consume.baseUrl 未声明 allowLoopbackConsume 时必须 FAILED（#601）
        # 顺序有意的：上一步已经证明「带逃生舱时 gradle 求值得通」，这一步只验闸 1 会不会咬。
        # 只有当 endpoints 里确实是回环地址时这一条才成立；一旦 #482 填了 https 生产 host，
        # 这里自动跳过并打印原因（不制造一条「改了配置就变红」的假门禁）。
        timeout-minutes: 5
        run: |
          # 退出码约定：0 = 确认是回环（继续做负向对照）/ 3 = 不是回环（跳过）/ 其他 = 探针自己坏了
          set +e
          node -e "
            const raw = require('./config/endpoints.json');
            const lb = ['127.0.0.1','localhost','::1','[::1]'];
            const host = (v) => { const r = String(v).replace(/^https?:\\/\\//,''); if (r.startsWith('[')) return r.slice(0, r.indexOf(']')+1); const i = r.indexOf(':'); return i >= 0 ? r.slice(0,i) : r; };
            const hits = [];
            for (const k of ['consume','pay']) { const v = raw?.[k]?.baseUrl; if (typeof v === 'string' && v.trim()) { if (lb.includes(host(v.trim()).toLowerCase())) hits.push(k + '.baseUrl=' + v.trim()); } }
            const m = raw?.migration; if (m?.enabled === true && typeof m.baseUrl === 'string' && m.baseUrl.trim() && lb.includes(host(m.baseUrl.trim()).toLowerCase())) hits.push('migration.baseUrl=' + m.baseUrl.trim());
            if (hits.length === 0) { console.log('SKIP: config/endpoints.json 里没有回环 base，闸 1 负向对照不适用'); process.exit(3); }
            console.log('回环 base: ' + hits.join(' '));
          "
          probe=$?
          set -e
          if [ "$probe" = "3" ]; then exit 0; fi
          if [ "$probe" != "0" ]; then echo "探针自身失败（exit=$probe），先修探针再谈闸 1"; exit 1; fi
          cd android
          set +e
          out=$(./gradlew help --no-daemon --console=plain 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out" | tail -40
          if [ "$code" = "0" ]; then
            echo "闸 1 没咬住：回环 consume.baseUrl 在没传 -PallowLoopbackConsume 的情况下通过了配置阶段（#601）"
            exit 1
          fi
          printf '%s\n' "$out" | grep -q "回环地址只能用于本地联调，不可分发" || {
            echo "闸 1 咬住了，但不是那条文案（先看上面 tail 出来的真实报错）"; exit 1; }
          echo "闸 1 负向对照通过：回环 base → 构建 FAILED，且打印了「回环地址只能用于本地联调，不可分发」"

      # ═══════════════ 失败归因：把「这个 job 里到底哪几道红」一次性说清楚 ═══════════════
      # 为什么需要它（准绳 #3「红必须可归因」）：
      #   GitHub 默认**在第一个失败步就停**。这个 job 有 60+ 步，于是「checks 红了」只告诉你
      #   **有 1 处**红；第 2 处要等你修完、重跑、再红才出现（一个人要跑七轮才知道有七处）。
      #   而 main 上同时躺着多道**既有红**（实测不是绿的：`check:ip` / `check:doc-refs` /
      #   `check:ui-shots` / `check:consume-api` / `check:log-coverage` / `check:refactor-direction` /
      #   `check:test-duplication`），所以光看「checks ✗」根本分不清「是我的改动还是既有债」。
      # 这一段只做一件事：**已经红了之后**，把区段 1 的门禁再跑一遍，一次性列出
      #   「哪几道红 / 各自的第一条判据 / 原地可复跑的命令」，给每道红打一条 `::error::` 注解
      #   （PR 页面直接可见），并写进 job summary。
      #
      # 三条自我约束（别把它扩张成第二个门禁）：
      #   1. `if: failure()` —— 只在已经红了之后跑；全绿时这一步一步都不多跑。
      #   2. 它**不改任何判定**：不写 continue-on-error、不吞退出码、不把红变绿，末尾 `exit 0`。
      #      job 的红色由前面那个真失败的步骤负责，与这里无关。
      #   3. 复跑清单**从本文件自己抽**（`gate-triage:begin/end` 之间的单行 `run:`），
      #      不维护第二份清单：往区段 1 加一道门禁，它就自动被纳入复跑。区段 1 的准入条件
      #      （不读 dist、只读仓库、单条 <10s）因此同时也是「谁配得上被复跑」的判据。
      #
      # 怎么用它判断「这红是不是我的」：在干净的 origin/main 副本上跑表里那条命令 ——
      #   **也红 = 既有债**（别在功能 PR 里顺手改，去修 main）；只有你的分支红 = 你的改动。
      - name: 失败归因：复跑区段 1 的门禁，列出「哪几道红 / 各自第一条判据」
        if: failure()
        timeout-minutes: 8
        run: |
          set -uo pipefail
          # 抽「区段 1 里单行 run 的门禁命令」；`run: |` 的多行块是负向对照，不在复跑范围
          mapfile -t cmds < <(sed -n '/gate-triage:begin/,/gate-triage:end/p' .github/workflows/ci.yml \
            | grep -E '^[[:space:]]*run: ' | sed 's/^[[:space:]]*run: //' | grep -E '^pnpm run ')
          if [ "${#cmds[@]}" -eq 0 ]; then
            echo "::warning::归因步骤没抽到任何门禁（gate-triage 标记被删/改名了？）—— 跳过归因，红在哪请翻日志"
            exit 0
          fi

          summary="$GITHUB_STEP_SUMMARY"
          {
            echo "## checks 失败归因（区段 1 复跑）"
            echo ""
            echo "本 job 在**第一个**失败步就停了，所以上面看不到其它红。下表是区段 1 全部 ${#cmds[@]} 道门禁的复跑结果："
            echo ""
            echo "| 门禁命令 | 结果 | 第一条判据 |"
            echo "| --- | --- | --- |"
          } >> "$summary"

          red=0
          for cmd in "${cmds[@]}"; do
            # 故意不加引号：命令里带 `-- --strict` 这类参数，要按词拆分再执行
            out="$(mktemp)"
            if $cmd > "$out" 2>&1; then
              printf '| `%s` | ✅ 绿 | |\n' "$cmd" >> "$summary"
              rm -f "$out"
              continue
            fi
            red=$((red + 1))
            # 挑「认罪那一行」：先滤掉 pnpm 的安装噪音（本仓 `verifyDepsBeforeRun` 会打一堆），
            # 再找判决式短语；都找不到就退化成首行非空 —— 绝不因为挑不到就写空。
            noise='installing dependencies|verifyDepsBeforeRun|out of sync|Lockfile|Already up to date|workspace hoist|Failed to create directory|╰─▶'
            verdict='✗|FAIL|发现 [0-9]+ 处|不通过|不合格|越界|空行|不在白名单|结论：|合计：'
            first="$(grep -vE "$noise" "$out" | grep -m1 -E "$verdict" || true)"
            [ -n "$first" ] || first="$(grep -vE "$noise" "$out" | grep -m1 -E '[^[:space:]]' || true)"
            first="$(printf '%s' "$first" | sed -e 's/|/\\|/g' -e 's/`/ /g' | cut -c1-200)"
            printf '| `%s` | ❌ 红 | `%s` |\n' "$cmd" "$first" >> "$summary"
            echo "::error title=门禁红 ${cmd}::${first}"
            rm -f "$out"
          done

          {
            echo ""
            if [ "$red" -eq 0 ]; then
              echo "区段 1 现在全绿 —— 失败在区段 2~5（网络 / 类型 / 行为 / 产物 / gradle）。看上面第一个红步骤的名字。"
            else
              echo "区段 1 共 **$red** 道红（这里只说区段 1）。"
              echo ""
              echo "判断「是不是我的改动」：在干净的 origin/main 副本上跑同一条命令。"
              echo "**也红 = 既有债**（不要在功能 PR 里顺手改，去修 main）；只有你的分支红 = 你的改动。"
            fi
          } >> "$summary"
          exit 0

  # ───────────────────────── Issue #404：黄金回归套件（每域 1 条主路径，≤5 分钟）─────────────────────────
  # 为什么单开一个 job：它是「功能开发有没有打断用户路径」的第一道闸，必须在**别的 job 失败时也照跑**
  # （不 needs: checks、不 needs: integration），这样 lint/类型红的时候也能看出「主路径是不是好的」。
  #
  # 三条设计约束：
  # 1) 独立、并行：与 checks 同时起步，PR 页面上两条结果分开展示，谁红谁负责。
  # 2) 预算机械化：单条 ≤60s、整层墙钟 ≤5 分钟由 tests/run-golden.mjs 自己判定（超预算直接 exit 1），
  #    不靠人盯日志；这一步只负责把它的退出码透传出去。
  # 3) 产物只构建标准包：黄金套件测的是用户装的那个标准版本，内测包（build:internal）的差异不属于主路径；
  #    缺产物在 run-golden 里是**直接红**，不是 SKIP(env)——阻塞门禁不许「什么都没跑还全绿」。
  golden:
    name: 黄金回归（每域主路径，≤5 分钟）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # #405：整条流水线里两个「真要浏览器」的 job 都跑在 playwright 官方镜像里。
    # 镜像自带 Chromium（/ms-playwright）+ 全部 apt 运行库，于是 `playwright install --with-deps`
    # 那一步（首跑时 apt 抖一下就是 9m07s 的主因）整步消失，只剩一条「镜像里真的有浏览器吗」的自检。
    # tag 必须与 package.json 的 playwright 版本对齐（v1.64.1 → chromium-1248）；对不上时自检会红，
    # 而不是等到 45 条用例在假绿/崩溃里漂。
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-jammy
      # Playwright 官方 Docker 文档的推荐参数：容器默认 /dev/shm 只有 64MB，Chromium 在渲染
      # 大页面（本仓的 feedback-scroll / 长会话截图）时会直接崩成 "Target page, context or browser
      # has been closed" —— 那是环境假红，不是用例真失败。
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # #405：浏览器来自镜像，不再下载。但这不等于「一定有」：镜像 tag 与 package.json 的
      # playwright 版本一旦错位（1.64.1 要 chromium-1248），用例只会变成整批崩溃或假红。
      # 这里把「镜像里真有这个 revision 的浏览器」变成显式断言（不联网、< 1s）。
      - name: 浏览器自检（镜像内置 Chromium 与本仓 playwright 版本对齐）
        # 这段 bash 以前在 golden 与 integration 里各抄了一份（一字不差）—— 抽成复合 action，
        # 免得哪天只改了其中一份，变成「一个 job 红、另一个 job 照样绿」。
        # 动作本体：`.github/actions/playwright-image-selfcheck/action.yml`
        uses: ./.github/actions/playwright-image-selfcheck

      # #510：黄金回归里的「启动即进主界面」用例（G1~G11）要的是**已登录**产物 ——
      # `src/main.tsx` 把整个 App 包在 `<AuthGate>` 里之后，未登录冷启动只画登录页，
      # 侧栏 / 输入框根本拿不到。所以这一步带 `TEST_AUTH_SEAM=1` 构建：rspack 的 DefinePlugin
      # 把 `__TEST_AUTH_STATE__` 内联成一个**假会话**，AuthGate 直接放行。
      # 发版产物绝不允许带这个开关：checks job 的 `check:test-seam` 扫的就是**不带**它的产物，
      # `build.mjs` 每次构建后也会自扫一遍（见 scripts/lib/testAuthSeam.mjs）。
      - name: 构建标准产物（dist，variant=standard，带登录接缝）
        env:
          TEST_AUTH_SEAM: '1'
        run: pnpm run build

      # 正向对照：上面这一步确实是「接缝构建」——扫不到假 token 说明开关没生效，
      # 那样 G1~G11 会以「登录页挡住了」的形式假红，先在这里拆穿。
      - name: 正向对照：接缝构建的产物里必须扫得到假会话（check:test-seam --expect-seam）
        run: node scripts/check-test-seam.mjs --expect-seam dist

      - name: 黄金回归（每域 1 条主路径）
        env:
          # 断言里有中文文案，与 unit / L1 一致钉住 locale（#179 同类问题）
          LANG: zh_CN.UTF-8
          LC_ALL: zh_CN.UTF-8
        run: pnpm run test:golden -- --json golden-report.json

      # 失败可见性：每条路径的耗时与「哪条路径 + 哪一步 + 期望 vs 实际」必须直接出现在 PR 页面，
      # 而不是让人点进 300 行日志里翻。
      - name: 失败摘要写入 job summary
        if: always()
        run: |
          set -euo pipefail
          cat > /tmp/golden-summary.mjs <<'EOF'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs'

          const lines = ['## 黄金回归（每域 1 条主路径）', '']
          const file = 'golden-report.json'
          if (!existsSync(file)) {
            lines.push('报告缺失：套件在写出 `--json` 之前就终止了（构建/浏览器缺失或崩溃），请看该 job 的日志。')
          } else {
            const report = JSON.parse(readFileSync(file, 'utf8'))
            lines.push('| 路径 | 域 | 结果 | 耗时 | 主路径 |', '| --- | --- | --- | --- | --- |')
            for (const item of report.results) {
              lines.push(`| ${item.id} | ${item.domain} | ${item.status} | ${item.ms}ms | ${item.title} |`)
            }
            lines.push(
              '',
              `墙钟 ${report.totalMs}ms / 预算 ${report.budgetMs}ms${report.overBudget ? '（**已超 5 分钟预算**）' : ''}。`,
            )
            const failed = report.results.filter((item) => item.status !== 'PASS')
            if (failed.length) {
              lines.push('', '### 失败定位')
              for (const item of failed) {
                lines.push('', `#### \`${item.id} ${item.domain}\` — ${item.title}`)
                lines.push('```', ...item.failures.slice(0, 4), '```')
              }
            }
          }
          const body = lines.join('\n')
          console.log(body)
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${body}\n`)
          EOF
          node /tmp/golden-summary.mjs

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-report
          path: golden-report.json
          if-no-files-found: warn
          retention-days: 7

  # ───────────────────────────────── Issue #365：L1 集成层接入 CI ─────────────────────────────────
  # 接线前：tests/integration/ 49 个文件 / 1.68 万行、全量一次 20 分钟，**零触发点**——
  # 只有人记得手跑 `pnpm test:integration`，于是「写好的集成用例」和「真的会被执行的用例」是两件事。
  #
  # 四条设计约束：
  # 1) 与 checks 并行（不 needs: checks）：L1 慢，串在门禁后面等于反馈时间相加。
  # 2) 分片 6 个 job 各自跑 `--shard i/6`：分片是**对全集的可复用划分**（见 tests/run-layer.mjs 的
  #    planShard），新加用例不会漏跑；权重表只用于均衡，不用于覆盖。
  # 3) 已知红走 tests/integration-baseline.json 的豁免（`--baseline` 只判「相对基线没有新增失败」），
  #    不用 continue-on-error —— 那会把真红也变绿，等于没接线。
  # 4) （#405）跑在 playwright 官方镜像里：浏览器与 apt 运行库都在镜像里，`playwright install
  #    --with-deps` 整步消失（首跑 9m07s 的 apt 抖动就是这么来的）。
  #
  # #405 为什么是 6 而不是 5：45 个文件的实测耗时（见 tests/integration-shard-weights.json）用 LPT
  # 分桶后，单分片负载是
  #     3 片 371s / 4 片 278s / 5 片 222s / **6 片 188s** / 7 片 188s / 8 片 188s
  # 188s 是硬下限 —— 最慢的单个文件 feedback-scroll 自己就 ~188s，再切也不会低于它。
  # 所以 6 片是唯一能同时满足「≤4 分钟」和「不为 0 收益多开 job」的档位（7/8 片只是多烧机器）。
  # 分片数写在矩阵里；下方的覆盖自检按 matrix.total 反推，改这里不用再改别处。
  integration:
    name: L1 集成层 ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # #510：L1 里大量用例要「启动即进主界面」（未登录冷启动只画登录页时拿不到侧栏）。
      # 放在 **job 级** 是为了让用例**自建产物**的那几条也带上：
      # copy-limit / update-stuck-button-373 自己 spawn rspack 打 dist-copy-limit / dist-update-373，
      # 用的是 `{ ...process.env }`，job 级 env 会继承下去。不带它的生产产物由
      # checks job 的 check:test-seam 与 scripts/build.mjs 的自扫守卫保证干净。
      TEST_AUTH_SEAM: '1'
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-jammy
      # 同 golden job：容器默认 64MB /dev/shm 会让 Chromium 渲染长页面时崩成环境假红。
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        total: [6]
    steps:
      # fetch-depth: 0 不是为了构建 —— motion.test.mjs 用 `git merge-base HEAD origin/main`
      # 取「与本分支的分叉点」当静态对照基线（以前钉死 SHA，历史一挪就假红）；默认的 depth=1
      # PR checkout 里没有 origin/main 这个 ref，等于整条用例一进来就 git 失败（实测 431ms 假红）。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # #365 的核心风险：分片写死在 ci.yml 里、新加的用例没人跑 —— 那正是这条 Issue 要治的病。
      # 这里把「N 个分片合起来 = 全集」变成显式断言（不依赖人肉核对，新文件自动进分片）。
      # #405 起分片数从矩阵的 matrix.total 反推（3 → 6 只改一处），并且顺带打印每个分片的
      # 文件数与预计负载 —— 均衡性直接写在 CI 日志里，不用下 artifact 才算。
      - name: 分片覆盖自检（每个集成文件恰好落进一个分片）
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          total_files=$(node tests/run-layer.mjs integration --list | grep -c '^\[integration\]')
          sum=0
          for i in $(seq 1 "${{ matrix.total }}"); do
            n=$(node tests/run-layer.mjs integration --list --shard "$i/${{ matrix.total }}" | grep -c '^\[integration\]')
            echo "分片 $i/${{ matrix.total }}：$n 个文件"
            sum=$((sum + n))
          done
          echo "全集 $total_files 个文件 / 分片合计 $sum 个"
          if [ "$sum" -ne "$total_files" ]; then
            echo "::error::分片没有覆盖全集（$sum != $total_files）：有集成用例不会被执行"
            exit 1
          fi
      # #405：容器里 workspace 的属主是 runner 的 uid，而步骤以 root 执行 —— git 会把仓库判成
      # 「dubious ownership」并拒绝一切命令。checkout action 只是在它自己那个**临时** HOME 里加了
      # safe.directory，我们的步骤继承不到。motion.test.mjs 要用 `git merge-base HEAD origin/main`
      # 取静态对照基线（#365），否则整条用例 0.5s 假红（实测 NEW FAIL）。这里把 workspace 写进真
      # global config，后续步骤都可继承。
      - name: git 安全目录（容器内 workspace 属主 ≠ 执行用户）
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # #405：浏览器与 apt 运行库都来自镜像，`playwright install --with-deps chromium` 整步删除。
      # 但「镜像里有」不能靠信念：镜像 tag 与 package.json 的 playwright 版本错位时（1.64.1 要
      # chromium-1248），45 条用例会变成整批崩溃/假红。这里把 revision 对齐变成显式断言（不联网、< 1s）。
      - name: 浏览器自检（镜像内置 Chromium 与本仓 playwright 版本对齐）
        # 这段 bash 以前在 golden 与 integration 里各抄了一份（一字不差）—— 抽成复合 action，
        # 免得哪天只改了其中一份，变成「一个 job 红、另一个 job 照样绿」。
        # 动作本体：`.github/actions/playwright-image-selfcheck/action.yml`
        uses: ./.github/actions/playwright-image-selfcheck

      # 集成层只读预构建产物，不隐式构建；缺产物时用例会 SKIP(env)（不算失败）而不是真跑。
      # 这里把三份变体都备齐：dist=internal / dist-standard / dist-scroll。
      # copy-limit 与 update-stuck-button-373 各带自建产物（dist-copy-limit / dist-update-373），不在此列。
      - name: 构建被测产物（internal / standard / scroll，带登录接缝）
        # 三份变体都带上 job 级的 `TEST_AUTH_SEAM=1`（见 job env）：DefinePlugin 内联假会话，
        # AuthGate 直接放行；用例自建的 dist-copy-limit / dist-update-373 也继承这个开关。
        run: |
          set -euo pipefail
          pnpm run build:internal                 # → dist/          内测变体（diagnostics / motion / mode-switch 等）
          DIST_OUT=dist-standard pnpm run build    # → dist-standard/ 标准变体（大多数用例）
          DIST_OUT=dist-scroll   pnpm run build    # → dist-scroll/   滚动截图专用（feedback-scroll）
          ls -d dist dist-standard dist-scroll

      - name: L1 集成 · 分片 ${{ matrix.shard }}/${{ matrix.total }}
        id: l1
        env:
          # 用例里有中文文案断言，和 unit 层一样钉住 locale（#179 同类问题）
          LANG: zh_CN.UTF-8
          LC_ALL: zh_CN.UTF-8
          # 单文件超时 7 分钟：实测最慢的 feedback-scroll ≈ 194s（自带的 360×640 键盘态重试），
          # 留 2× 余量；比 180s 默认值宽，比 10 分钟保守 —— 真挂住别把 25 分钟 job 超时吃满。
          L1_TIMEOUT_MS: '420000'
          # ───────── Issue #456：跨 runner 判据要的两样输入 ─────────
          # 1) runner 身份：`runner.name` 是 GitHub 给这个 job 分的机器名（每个 job 一台新 VM），
          #    run-layer 据此写 `ci:<name>`；没有它，「换 runner 才红」就永远判不出来。
          RUNNER_NAME: ${{ runner.name }}
          JOB_NAME: L1-${{ matrix.shard }}/${{ matrix.total }}
          # 2) 运行记录目录：本分片的逐文件结果 + runner + 负载快照，写在 workspace 里，
          #    下一步作为 artifact 上传，由 flaky-cross-runner job 汇总比对（跨分片/跨 attempt/跨机器）。
          FLAKY_RUNS_DIR: flaky-runs
        run: |
          set -euo pipefail
          node tests/run-layer.mjs integration \
            --shard "${{ matrix.shard }}/${{ matrix.total }}" \
            --baseline \
            --timeout-ms "$L1_TIMEOUT_MS" \
            --json "l1-report-${{ matrix.shard }}.json"
          # --baseline 的语义见 run-layer.compareWithBaseline：
          #   新增失败 / 基线登记红却跑绿（FIXED?，提醒删条目）→ 退出码 1；其余 0。
          # 因此这里不需要 continue-on-error：真红会红，登记过的已知红不会红。
          # #456：同一步里 run-layer 已经把「三态（真红 / flaky / runner-dependent）」与
          # 「时序窗口静态提示」写进 job summary（GITHUB_STEP_SUMMARY 由 Actions 自动提供）。

      # #456：运行记录必须活过分片 —— 判据要的是「同一份代码在**别的机器**上是什么结论」，
      # 而其它分片跑在别的 VM 上、re-run 又是另一台。artifact 是这两者唯一的汇合点。
      - name: 上传运行记录（跨 runner 判据的输入）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-run-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: flaky-runs/
          if-no-files-found: warn
          retention-days: 7

      # 失败可见性：绿的时候只在日志里，红的时候必须能在 PR 页面直接看到「哪个文件、哪条断言」。
      - name: 失败摘要写入 job summary
        if: always()
        env:
          REPORT: l1-report-${{ matrix.shard }}.json
          SHARD: ${{ matrix.shard }}/${{ matrix.total }}
          # #405 的单 job 预算是 4 分钟（240s），其中约 30s 是 checkout / install / 构建三份产物
          # 这些固定开销，所以「跑用例那一段」的预算定在 210s；超了只在 summary 里标出来提醒
          # （不让它变红 —— 时间抖动不是代码问题，靠人看趋势）。
          SHARD_BUDGET_MS: '210000'
        run: |
          set -euo pipefail
          cat > /tmp/l1-summary.mjs <<'EOF'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs'

          const shard = process.env.SHARD ?? '?'
          const file = process.env.REPORT ?? 'l1-report.json'
          const budgetMs = Number(process.env.SHARD_BUDGET_MS ?? 240000)
          const secs = (ms) => Math.round(ms / 1000)
          const clip = (line, max = 240) => (line.length > max ? `${line.slice(0, max)}…` : line)
          const FAIL_LINE = /not ok|✗|AssertionError|Error:|error:|FAIL|expected|实际|TIMEOUT/
          // #456：三态标签。报告里每条结果都带 `triState`（由 run-layer 判定），
          // 这里只负责把它翻成人话 —— 判定口径不在 YAML 里重新实现一遍。
          const TRI = {
            green: '绿',
            flaky: 'flaky（同 runner 重跑绿）',
            'runner-dependent': '**runner-dependent（跨 runner 不一致）**',
            'true-red': '真红（重跑仍红）',
          }
          const tri = (r) => TRI[r.triState] ?? r.triState ?? '—'
          const lines = [`## L1 集成层 分片 ${shard}`, '']

          if (!existsSync(file)) {
            lines.push('报告缺失：分片在写出 `--json` 报告之前就终止了（超时 / 崩溃），请看该 job 的日志。')
          } else {
            const report = JSON.parse(readFileSync(file, 'utf8'))
            const results = report.results ?? []
            const failed = results.filter((r) => !r.ok && !r.skipped)
            const skipped = results.filter((r) => r.skipped)
            lines.push(
              `| 结果 | 数量 |`,
              `| --- | --- |`,
              `| PASS | ${report.passed} |`,
              `| FAIL | ${report.failed} |`,
              `| SKIP(env) | ${report.skipped} |`,
              '',
              `本分片 ${report.executed}/${report.selected} 个文件，用时 ${secs(report.totalMs)}s / 预算 ${secs(budgetMs)}s` +
                (report.totalMs <= budgetMs ? '（在 #405 的单 job ≤4 分钟目标内）' : '（**超出 #405 的单 job ≤4 分钟目标**）') +
                '。',
              '',
              '| 文件 | 结果 | 三态 | 耗时 |',
              '| --- | --- | --- | --- |',
            )
            for (const r of [...results].sort((a, b) => b.ms - a.ms)) {
              const state = r.skipped ? 'SKIP(env)' : r.ok ? (r.flaky ? 'PASS(flaky)' : 'PASS') : r.timedOut ? 'FAIL(TIMEOUT)' : 'FAIL'
              lines.push(`| \`${r.file.split('/').pop()}\` | ${state} | ${tri(r)} | ${secs(r.ms)}s |`)
            }
            // runner-dependent 单独拎出来：PR 页面上一眼就能看出「这条红不是这台机器的问题」，
            // 处置是改成等终态（不是重跑、不是加 sleep）—— 见 docs/TESTING-POLICY.md §11.5。
            const dependent = results.filter((r) => r.triState === 'runner-dependent')
            if (dependent.length) {
              lines.push('', '### runner-dependent（跨 runner 结论不一致）→ 必须改成等终态，禁止加 sleep', '')
              for (const r of dependent) lines.push(`- \`${r.file}\`（本分片 runner 上是${r.ok ? '绿' : '红'}）`)
            }
            if (failed.length) {
              lines.push('', '### 失败文件与首个失败断言')
              for (const item of failed) {
                lines.push('', `#### \`${item.file}\`（${secs(item.ms)}s${item.timedOut ? '，TIMEOUT' : ''}）—— ${tri(item)}`)
                const tail = (item.tail ?? []).join('\n').split('\n').map((line) => line.trimEnd()).filter(Boolean)
                // 「第一个失败断言」单独拎出来放在最前面：失败时人在 PR 页面上要的就是这一行。
                const firstFail = tail.find((line) => FAIL_LINE.test(line))
                if (firstFail) {
                  lines.push('首个失败断言：', '', '```', clip(firstFail), '```')
                }
                const context = tail.filter((line) => FAIL_LINE.test(line)).slice(-8)
                const shown = (context.length ? context : tail.slice(-8)).map((line) => clip(line))
                lines.push('相关输出：', '', '```', ...shown, '```')
              }
            }
            if (skipped.length) {
              lines.push('', '### SKIP(env)（缺产物 / 环境不满足，不算失败）')
              for (const item of skipped) lines.push(`- \`${item.file}\` — ${item.skipReason}`)
            }
          }
          const body = lines.join('\n')
          console.log(body)
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${body}\n`)
          EOF
          node /tmp/l1-summary.mjs

      # 存 7 天：红的时候能直接下下来复跑（node tests/run-layer.mjs integration --failed-from l1-report-N.json）
      - name: 上传分片报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-report-${{ matrix.shard }}-of-${{ matrix.total }}
          path: l1-report-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  # ───────────────────────── Issue #456：跨 runner 判据的汇总 job ─────────────────────────
  # 为什么必须是**另一个 job**：#406 的判据（失败→重跑一次→绿）只能看见「自己这台机器」。
  # 而最常见的 flake 是「同机怎么跑都绿、换 runner 就红」（#406 的 url-import-stages case 10：
  # 窗口 ≈2.4s，慢机连跑 10/10 绿、注入 3s 延迟即红）。那类红在同一台机器上**必然复现**，
  # 所以旧判据永远登记不到它 —— 登记簿长期为空不是「没有 flake」，是判据看不见这个变量。
  #
  # 这里做的事只有一件：把「同一 commit 上各台机器的结论」放到一起比。
  #   · 输入 = 各分片上传的 flaky-run-* artifact（已含 runner 身份 + 负载快照）
  #            + 同一 head SHA 的**其它 run/attempt** 的记录（re-run 落在另一台 VM 上）；
  #   · 判据 = 同 commit + 同用例 + 结果不同 + runner 不同 → 登记 kind: "cross-runner"；
  #   · 输出 = job summary 的三态表 + 更新后的登记簿 artifact。
  #
  # 三条刻意的取舍：
  # 1) **不阻塞合流**：本条用例真红时，跑它的那个分片已经红了（那才是门禁）。这个 job 负责
  #    「说清是哪一种红」，用 blocking 只会让「一台机器慢」变成全队卡死。
  # 2) `if: always()`：分片红的时候恰恰最需要它 —— 判据的价值就在「红的那份记录」。
  # 3) 收集不到记录时**明说结论不可用**，不输出「全绿」：空 artifact 与「没有分叉」是两件事。
  flaky-cross-runner:
    name: flaky 三态与跨 runner 判定
    needs: [integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 读同仓其它 run 的 artifact 列表要 actions: read（下载 zip 用同一份 token）
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 只需要 run-layer / flaky-registry 两个文件，浅取即可
          fetch-depth: 1

      # 纯 Node、零依赖（run-layer 只 import node 内置模块），所以**不需要 pnpm install**：
      # 这个 job 的耗时基本只有 checkout 和这点 IO。
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 这里用 continue-on-error **不是**豁免：这一步只负责「把本 run 各分片的记录搬过来」，
      # 搬空（integration 被取消 / 分片在写记录前就挂了）这件事由下一步「输入份数断言」显式判红。
      # 换句话说：红没有消失，只是从「download-artifact 报 Unable to find any artifacts」
      # （一句看不出含义的 action 报错）换成「0 份记录 → 结论不可用」（一句能归因的话）。
      # 以前这里只有 continue-on-error：下载失败 → 0 份记录 → 下面 `--cross-runner-scan` 读到空目录
      # → 打印「结论：没有分叉」→ **整个 job 绿**。那是把「什么都没检查」说成了「查过、没问题」。
      - name: 下载本 run 各分片的运行记录
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: flaky-run-*
          path: flaky-runs
          merge-multiple: true
        continue-on-error: true

      # 同一 head SHA 的其它 run（re-run / 多 attempt）落在别的 VM 上，是跨 runner 判据的主要来源之一。
      # 拿不到不是错误（分叉权限、artifact 过期、API 抖动），只打印一句，绝不让它变成红：
      # 判据的输入少一份，后果是「少看见一条」，而不是「结论错误」。
      # 这条 `continue-on-error` 之所以不是「把红变黄」：它收集的是**额外**证据，本 run 各分片的
      # 记录由上面那一步搬，而「到底有几份输入」由下面那条硬断言判红 —— 没有输入绝不会绿。
      - name: 收集同一 commit 其它 run 的运行记录（best-effort）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          mkdir -p flaky-runs other-runs
          cat > /tmp/collect-runs.mjs <<'EOF'
          import { writeFileSync } from 'node:fs'
          const { GH_TOKEN, REPO, API, SHA } = process.env
          const headers = { Authorization: `Bearer ${GH_TOKEN}`, Accept: 'application/vnd.github+json' }
          // 整个收集过程都是 best-effort：网络/权限/过期任何一环出问题，结论只损失一份输入，
          // 绝不能因此让这个 job 变红（红要来自「跑用例」，不来自「查历史」）。
          try {
            const list = await fetch(`${API}/repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=50`, { headers })
            if (!list.ok) {
              console.log(`::warning::列 run 失败（HTTP ${list.status}），跳过跨 run 收集`)
              writeFileSync('/tmp/collect-runs.json', '[]')
              process.exit(0)
            }
            const runs = (await list.json()).workflow_runs ?? []
            const found = []
            const currentRun = String(process.env.GITHUB_RUN_ID ?? '')
            const currentAttempt = String(process.env.GITHUB_RUN_ATTEMPT ?? '1')
            for (const run of runs) {
              // 本 run 的**当前这次 attempt** 上一步已经下载过了，再捞一遍只会让记录翻倍；
              // 但同一个 run_id 的**更早 attempt** 要留下来 —— re-run 落在另一台 VM 上，
              // 那正是「同 SHA、不同 runner」最干净的证据。
              if (String(run.id) === currentRun && String(run.run_attempt) === currentAttempt) continue
              const arts = await fetch(`${API}/repos/${REPO}/actions/runs/${run.id}/artifacts`, { headers })
              if (!arts.ok) continue
              for (const artifact of (await arts.json()).artifacts ?? []) {
                if (!artifact.name.startsWith('flaky-run-') || artifact.expired) continue
                found.push({ runId: run.id, attempt: run.run_attempt, name: artifact.name, url: artifact.archive_download_url })
              }
            }
            writeFileSync('/tmp/collect-runs.json', JSON.stringify(found, null, 2))
            console.log(`同一 commit（${SHA.slice(0, 12)}）共 ${runs.length} 个 run、${found.length} 份 flaky-run artifact`)
          } catch (error) {
            console.log(`::warning::收集其它 run 的记录失败（${error.message}），本轮只看得到本 run 的分片`)
            writeFileSync('/tmp/collect-runs.json', '[]')
          }
          EOF
          node /tmp/collect-runs.mjs || exit 0
          node -e 'const fs=require("node:fs");for(const a of JSON.parse(fs.readFileSync("/tmp/collect-runs.json","utf8")))console.log(a.url)' > /tmp/urls.txt
          while read -r url; do
            [ -n "$url" ] || continue
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" -o /tmp/other.zip "$url" || continue
            unzip -oq /tmp/other.zip -d other-runs || continue
          done < /tmp/urls.txt
          # 平铺进 flaky-runs：文件名加序号，避免「同名 runner 的两次 attempt」互相覆盖
          index=0
          while read -r file; do
            [ -n "$file" ] || continue
            index=$((index + 1))
            cp -f "$file" "flaky-runs/other-$index-$(basename "$file")"
          done < <(find other-runs -name 'run-*.json' 2>/dev/null)
          # 剩下的交给 run-layer：它只认 `object: flaky-run-record` 的 json，读不进去的直接跳过
          echo "合并后记录数：$(find flaky-runs -name '*.json' | wc -l)"
          ls -1 flaky-runs | head -20

      # 输入份数断言（**fail-closed**）：0 份记录 = 这一轮「三态判定」没有任何输入。
      # 为什么必须判红，而不是让 `--cross-runner-scan` 读到空目录然后打印一句
      # 「结论：没有分叉」—— 那正是「什么都没检查」被说成「查过、没问题」。
      # 这一步的注释里两处 `continue-on-error` 都不是豁免：它们允许「输入缺失」发生在收集环节，
      # 但**不允许它无声通过**，判红点被挪到这里，好让人一眼看出红的是「没有输入」而不是「有 flake」。
      # 归属：本步红 ≠ 用例红（用例真红在 integration 分片里已经红了）。本步红的含义是
      #   「integration 没把运行记录交上来」—— 分片被取消 / 在写记录前就挂了 / artifact 过期。
      # 没有到期日、也不该有：这是「判据有没有输入」的硬断言，不是可以慢慢修的技术债。
      - name: 输入份数断言：0 份运行记录 → 结论不可用（这一条红不是用例红）
        if: always()
        run: |
          set -euo pipefail
          n=$(find flaky-runs -name '*.json' 2>/dev/null | wc -l)
          runners=$(grep -ho '"id": *"[^"]*"' flaky-runs/*.json 2>/dev/null | sort -u | wc -l)
          echo "跨 runner 判据的输入：${n} 份运行记录 / ${runners} 个 runner 身份"
          if [ "$n" -eq 0 ]; then
            echo "::error title=跨 runner 判据无输入::flaky-runs/ 里 0 份记录：integration 没有把运行记录交上来（分片被取消 / 在写记录前就挂了 / artifact 被清理）。这一轮「三态判定」结论不可用，不是「没有 flake」。"
            exit 1
          fi
          {
            echo "## 跨 runner 判据的输入"
            echo ""
            echo "- 运行记录：**${n}** 份"
            echo "- runner 身份：**${runners}** 个（<2 时判不出「换机器才红」这一类，本轮结论只有单机视角）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 跨 runner 判定 + 登记（三态写进 job summary）
        if: always()
        env:
          # 记录目录里同时有本 run 各分片与其它 attempt 的记录
          FLAKY_RUNS_DIR: flaky-runs
        run: |
          set -euo pipefail
          node tests/run-layer.mjs --cross-runner-scan \
            --record-dir flaky-runs \
            --json cross-runner-report.json

      # 登记簿的更新要能被下来（CI 不能 push，也不该 push）：合并后由人/后续单把条目落进仓库，
      # 或者本地跑一遍同一条命令即可得到同样的结果（判据是确定性的）。
      - name: 上传跨 runner 报告与登记簿
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-cross-runner
          path: |
            cross-runner-report.json
            tests/flaky-registry.json
          if-no-files-found: warn
          retention-days: 14
