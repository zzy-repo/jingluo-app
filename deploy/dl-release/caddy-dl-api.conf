# dl.rose7.cn 发布接口反代片段
#
# 用法：整段粘贴进 /opt/caddy/Caddyfile 里 **已有的** `handle @dl { ... }` 块内，
#       位置在 `file_server` 之前。不要新建站点块——全站是 *.rose7.cn 通配站点。
#
# 生效（禁止 systemctl restart，会掉 cert 管理进程）：
#   cd /opt/caddy
#   set -a; . /opt/caddy/caddy.env; set +a
#   ./caddy-alidns validate --config /opt/caddy/Caddyfile --adapter caddyfile
#   ./caddy-alidns reload   --config /opt/caddy/Caddyfile --adapter caddyfile --address unix//run/caddy/admin.sock

		# ===== 发布接口：POST /api/v1/release + GET /api/v1/version → 本机 dl-release 服务 =====
		# 只反代这两个路径，其余仍是静态文件；服务只监听 127.0.0.1:8799。
		# /api/v1/version（#441）是免令牌的版本自证端点：反代漏了它，线上就答不出
		# 「跑的是哪一版」，部署验收（docs/RELEASE-MANUAL.md §12）会直接 404。
		# X-Real-IP 由 Caddy 覆盖写入（客户端自带的值会被丢弃），服务端据此限流。
		@api path /api/v1/release /api/v1/version
		reverse_proxy @api 127.0.0.1:8799 {
			header_up X-Real-IP {remote_host}
		}
